<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>13F · AI Hedge Fund Tracker</title>
<style>
:root {
  --bg: #0c0f14;
  --bg-elev: #131720;
  --bg-elev2: #1a1f2b;
  --bg-hover: #20263a;
  --border: #232a3a;
  --border-strong: #2f3850;
  --text: #e6e8ee;
  --text-dim: #8a93a6;
  --text-faint: #5a637a;
  --accent: #66b3ff;
  --accent-soft: rgba(102,179,255,0.12);
  --calls: #4ade80;  /* green */
  --puts: #f87171;   /* red */
  --sa: #fbbf24;     /* yellow — Situational Awareness reference */
  --row-hover: #1c2233;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 13px; line-height: 1.45; }
body { min-height: 100vh; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font-family: inherit; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- Layout ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  font-weight: 700;
  letter-spacing: 0.5px;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.brand .sub { color: var(--text-dim); font-weight: 400; }

nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
nav.tabs a {
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
}
nav.tabs a:hover { background: var(--bg-hover); color: var(--text); }
nav.tabs a.active { color: var(--text); background: var(--bg-elev2); }

.search {
  margin-left: auto;
  position: relative;
}
.search input {
  width: 260px;
  background: var(--bg-elev2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
.search input:focus { border-color: var(--accent); }
.search-results {
  position: absolute;
  top: 32px;
  right: 0;
  width: 320px;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 6px 0;
  max-height: 360px;
  overflow-y: auto;
  display: none;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.search-results.show { display: block; }
.search-results .group { font-size: 10px; text-transform: uppercase; color: var(--text-faint); padding: 6px 12px 2px; letter-spacing: 0.5px; }
.search-results .item { padding: 5px 12px; cursor: pointer; font-size: 12px; display: flex; gap: 8px; align-items: center; }
.search-results .item:hover { background: var(--bg-hover); }
.search-results .item .t { font-family: var(--font-mono); color: var(--accent); width: 70px; }
.search-results .item .name { color: var(--text-dim); font-size: 11px; }

.btn {
  background: var(--bg-elev2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.btn:hover { background: var(--bg-hover); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #0c0f14; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }

.min-pct-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-dim);
}
.min-pct-toggle select {
  background: var(--bg-elev2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 11px;
  padding: 4px 6px;
  cursor: pointer;
  outline: none;
}
.min-pct-toggle select:focus { border-color: var(--accent); }

.main {
  padding: 18px 24px 80px;
  max-width: 1500px;
  margin: 0 auto;
}

h1, h2, h3, h4 { font-weight: 600; margin: 0; color: var(--text); }
h1 { font-size: 16px; }
h2 { font-size: 14px; margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0 0 8px; }

/* ---------- Cards ---------- */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.card .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.card .card-header .right { display: flex; gap: 8px; align-items: center; color: var(--text-faint); font-size: 11px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }

/* ---------- Tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  text-align: left;
  font-weight: 500;
  color: var(--text-faint);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.5px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  position: sticky;
  top: 0;
}
thead th.num { text-align: right; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }
thead th .sort-ind {
  display: inline-block;
  margin-left: 4px;
  color: var(--accent);
  font-size: 10px;
  width: 8px;
}
thead th.sort-active { color: var(--text); }
tbody td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--row-hover); cursor: pointer; }
tbody tr.fund-row { cursor: default; }
tbody td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

.ticker {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
}
.ticker:hover { text-decoration: underline; }

/* ---------- Category chips ---------- */
.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev2);
  color: var(--text-dim);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.cat-chip .swatch { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.cat-chip.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

.category-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

/* ---------- Badges ---------- */
.badge {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  font-family: var(--font-mono);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  font-weight: 600;
}
.badge.calls { background: rgba(74,222,128,0.18); color: var(--calls); }
.badge.puts  { background: rgba(248,113,113,0.18); color: var(--puts); }
.badge.new   { background: rgba(102,179,255,0.18); color: var(--accent); }
.badge.sa    { background: rgba(251,191,36,0.18); color: var(--sa); }
.badge.high  { background: rgba(248,113,113,0.22); color: var(--puts); }

/* ---------- Stacked bars ---------- */
.stacked-bar {
  display: flex;
  height: 14px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--bg-elev2);
  min-width: 120px;
}
.stacked-bar .seg { height: 100%; }
.stacked-bar .seg.eq    { background: #2563eb; }
.stacked-bar .seg.calls { background: var(--calls); }
.stacked-bar .seg.puts  { background: var(--puts); }

.bar-thin {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-elev2);
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}
.bar-thin .fill { height: 100%; background: var(--accent); }

/* ---------- Stats row ---------- */
.stat-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
.stat { min-width: 110px; }
.stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 2px; }
.stat .value { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--text); }
.stat .value.small { font-size: 14px; }
.stat .sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

/* ---------- Drawer ---------- */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 200;
}
.drawer-overlay.show { display: block; }
.drawer {
  position: fixed;
  top: 0; right: -560px;
  width: 540px; max-width: 90vw;
  height: 100vh;
  background: var(--bg-elev);
  border-left: 1px solid var(--border-strong);
  transition: right 0.18s ease;
  z-index: 201;
  display: flex;
  flex-direction: column;
}
.drawer.show { right: 0; }
.drawer-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
.drawer-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.drawer-close:hover { color: var(--text); }

/* ---------- Fund list ---------- */
.fund-card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.fund-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
}
.fund-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.fund-card.sa { border-left: 3px solid var(--sa); }
.fund-card h4 { font-size: 13px; margin-bottom: 2px; }
.fund-card .manager { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.fund-card .meta { display: flex; gap: 14px; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.fund-card .meta .v { color: var(--text); font-family: var(--font-mono); }

/* Top-3 mini-lists inside each fund card */
.fund-card .mini-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.fund-card .mini-head {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.fund-card .mini-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  padding: 2px 0;
  font-size: 11px;
  cursor: pointer;
}
.fund-card .mini-row:hover .t { color: var(--text); }
.fund-card .mini-row .t { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.fund-card .mini-row .v { font-family: var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.fund-card .mini-empty {
  font-size: 10px;
  color: var(--text-faint);
  font-style: italic;
  padding: 4px 0;
}

/* Manage mode (iPhone-home-screen style edit) */
.fund-card .remove-x {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--puts);
  color: white;
  border: 2px solid var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  z-index: 5;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.fund-card.editable { animation: wiggle 0.4s infinite; position: relative; }
.fund-card.editable .remove-x { display: flex; }
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25%      { transform: rotate(-0.5deg); }
  75%      { transform: rotate(0.5deg); }
}
.fund-card.add-card {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  min-height: 220px;
  border: 1.5px dashed var(--border-strong);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
}
.fund-card.add-card:hover { border-color: var(--accent); color: var(--accent); }
.fund-card.add-card .plus { font-size: 28px; line-height: 1; }

/* Add-fund modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center; z-index: 250;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  width: 540px; max-width: 95vw;
  max-height: 75vh;
  display: flex; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 14px; margin: 0; }
.modal-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
.modal input.search {
  width: 100%; background: var(--bg-elev2);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); padding: 8px 10px; font-family: inherit; font-size: 13px; outline: none;
}
.modal input.search:focus { border-color: var(--accent); }
.modal .results { margin-top: 12px; }
.modal .result {
  padding: 8px 10px; border-radius: 4px;
  cursor: pointer; display: flex; justify-content: space-between; gap: 12px;
  font-size: 12px; border: 1px solid transparent;
}
.modal .result:hover { background: var(--bg-hover); border-color: var(--border); }
.modal .result .name { color: var(--text); }
.modal .result .meta-r { color: var(--text-faint); font-family: var(--font-mono); font-size: 10px; }

/* List view of funds */
.funds-list-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.funds-list-table th {
  text-align: left; font-weight: 500; color: var(--text-faint);
  text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px;
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  background: var(--bg-elev); position: sticky; top: 0; cursor: pointer; user-select: none;
}
.funds-list-table th:hover { color: var(--text); }
.funds-list-table th.num { text-align: right; }
.funds-list-table th.sort-active { color: var(--text); }
.funds-list-table th .sort-ind { color: var(--accent); margin-left: 4px; }
.funds-list-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.funds-list-table tbody tr { cursor: pointer; }
.funds-list-table tbody tr:hover { background: var(--row-hover); }
.funds-list-table tbody tr.sa-row { border-left: 3px solid var(--sa); }
.funds-list-table .fund-name { font-weight: 600; color: var(--text); }
.funds-list-table .fund-meta { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
.funds-list-table td.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.funds-list-table td.mini-cell { font-family: var(--font-mono); font-size: 11px; }
.funds-list-table td.mini-cell .mini-pair { display: inline-block; margin-right: 8px; }
.funds-list-table td.mini-cell .mini-pair .ticker { color: var(--accent); font-weight: 600; cursor: pointer; }
.funds-list-table td.mini-cell .mini-pair .pct { color: var(--text-dim); }
.funds-list-table .row-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%; background: var(--puts);
  color: white; font-size: 11px; line-height: 1; cursor: pointer; font-weight: 600;
}
.funds-list-table .row-x:hover { filter: brightness(1.15); }

/* View toggle */
.view-toggle { display: inline-flex; background: var(--bg-elev2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.view-toggle button { background: none; border: none; color: var(--text-dim); padding: 4px 10px; font-size: 11px; cursor: pointer; }
.view-toggle button.active { background: var(--accent-soft); color: var(--text); }
.view-toggle button:hover:not(.active) { color: var(--text); }

/* ---------- Section gaps ---------- */
.section { margin-bottom: 22px; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
.section-title .sub { font-size: 11px; color: var(--text-faint); text-transform: none; letter-spacing: 0; }

/* ---------- Compare ---------- */
.fund-picker {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.fund-picker label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.fund-picker label:hover { border-color: var(--accent); }
.fund-picker input[type=checkbox] { accent-color: var(--accent); }
.fund-picker label.checked { background: var(--accent-soft); border-color: var(--accent); }

.compare-grid { display: grid; gap: 16px; }
.compare-bars { display: grid; gap: 10px; }
.compare-bar-row { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 12px; }
.compare-bar-row .label { font-size: 12px; color: var(--text-dim); }
.compare-bar {
  height: 20px;
  background: var(--bg-elev2);
  border-radius: 3px;
  overflow: hidden;
  display: flex;
}
.compare-bar .seg { height: 100%; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--text-dim); }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }

/* ---------- View toggle ---------- */
.toggle-group { display: inline-flex; background: var(--bg-elev2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.toggle-group button {
  background: none;
  border: none;
  color: var(--text-dim);
  padding: 4px 12px;
  font-size: 11px;
  cursor: pointer;
}
.toggle-group button.active { background: var(--accent-soft); color: var(--text); }
.toggle-group button:hover:not(.active) { color: var(--text); }

/* ---------- Conviction map ---------- */
.conviction-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
@media (max-width: 1200px) { .conviction-wrap { grid-template-columns: 1fr; } }
.conviction-chart {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  position: relative;
}
.conviction-chart svg { display: block; width: 100%; height: auto; }
.conviction-chart .axis-label { fill: var(--text-faint); font-size: 10px; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.5px; }
.conviction-chart .tick-label { fill: var(--text-dim); font-size: 10px; font-family: var(--font-mono); }
.conviction-chart .grid-line { stroke: var(--border); stroke-dasharray: 2 3; stroke-width: 1; }
.conviction-chart .quadrant-line { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.conviction-chart .quadrant-label { fill: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; font-family: var(--font-sans); }
.conviction-chart .dot { cursor: pointer; transition: stroke-width 0.1s, filter 0.1s; }
.conviction-chart .dot:hover { stroke: var(--text); stroke-width: 1.5; filter: brightness(1.3); }
.conviction-chart .dot-label { fill: var(--text); font-size: 9px; font-family: var(--font-mono); pointer-events: none; }
.conviction-tooltip {
  position: absolute;
  background: var(--bg-elev2);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 8px 10px;
  font-size: 11px;
  pointer-events: none;
  display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 10;
  min-width: 200px;
}
.conviction-tooltip .t { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 13px; }
.conviction-tooltip .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 2px; color: var(--text-dim); }
.conviction-tooltip .row .v { color: var(--text); font-family: var(--font-mono); }

.conviction-side { display: flex; flex-direction: column; gap: 16px; }
.conviction-list { padding: 0; margin: 0; list-style: none; }
.conviction-list li {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 8px;
  padding: 6px 0;

/* ---------- Empty state ---------- */
.empty {

  text-align: center;
  color: var(--text-faint);
  font-size: 12px;
}

/* ---------- Edgar status ---------- */
.edgar-status {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 12px;
}
.edgar-status .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.edgar-status .row:last-child { border-bottom: none; }
.edgar-status .ok { color: var(--calls); }
.edgar-status .err { color: var(--puts); }

  </div>

<script>
'use strict';

// ============================================================================
// State
// ============================================================================
const STATE = {
  data: null,
  route: parseRoute(location.hash),
  filterCategory: null,
  compareSelection: new Set(),
  edgarResults: null,
  fundViewMode: 'all', // all | top10 | byCategory
  // Per-table sort state for the compare view: { common: {col, dir}, divergent: {...} }
  compareSort: { common: null, divergent: null },
  // Current prices: { TICKER: { price, asOf } } — refreshed via /api/prices
  currentPrices: {},
  pricesFetching: false,
  pricesError: null,
  // Funds-page edit mode + persisted user customizations (per browser via localStorage)
  editMode: false,
  hiddenCiks: new Set(JSON.parse(localStorage.getItem('hiddenCiks') || '[]')),
  customFunds: JSON.parse(localStorage.getItem('customFunds') || '[]'),
  fundsView: localStorage.getItem('fundsView') || 'cards', // 'cards' | 'list'
  fundsListSort: JSON.parse(localStorage.getItem('fundsListSort') || '{"col":"totalBn","dir":"desc"}'),
  // Global filter: hide positions below this fraction of a fund's 13F.
  // 0.01 (1%) by default; user can flip via the topbar toggle.
  minPositionPct: parseFloat(localStorage.getItem('minPositionPct') || '0.01'),
  // Sortable dashboard tables (Top names / High-conviction / Outsize bets)
  dashSort: JSON.parse(localStorage.getItem('dashSort') || '{}'),
};

// Returns true if the holding should be shown given the current min-position filter.
function passesMinPct(h) {
  return (h.pct || 0) >= STATE.minPositionPct;
}

function persistCustomizations() {
  try {
    localStorage.setItem('hiddenCiks', JSON.stringify([...STATE.hiddenCiks]));
    localStorage.setItem('customFunds', JSON.stringify(STATE.customFunds));
    localStorage.setItem('fundsView', STATE.fundsView);
    localStorage.setItem('fundsListSort', JSON.stringify(STATE.fundsListSort));
    localStorage.setItem('minPositionPct', String(STATE.minPositionPct));
    localStorage.setItem('dashSort', JSON.stringify(STATE.dashSort));
  } catch (_) {}
}

// Merge user-added custom funds in and filter out hidden CIKs.
// Use this anywhere we display the full fund list.
function visibleFunds() {
  const seen = new Set(STATE.data.funds.map(f => f.cik));
  const merged = [...STATE.data.funds];
  for (const cf of STATE.customFunds) if (!seen.has(cf.cik)) merged.push(cf);
  return merged.filter(f => !f.cik || !STATE.hiddenCiks.has(f.cik));
}

function parseRoute(hash) {
  hash = hash || '#/dashboard';
  const parts = hash.replace(/^#\//, '').split('/');
  return { name: parts[0] || 'dashboard', arg: parts[1] || null };
}

window.addEventListener('hashchange', () => {
  STATE.route = parseRoute(location.hash);
  render();
});

// ============================================================================
// Boot
// ============================================================================
async function boot() {
  // 1) Prefer inline-baked data (works via file:// and Vercel alike).
  const baked = document.getElementById('bakedData');
  if (baked && baked.textContent && baked.textContent.trim() && !baked.textContent.includes('__BAKED_DATA__')) {
    try { STATE.data = JSON.parse(baked.textContent); } catch (e) {}
  }
  // 2) Otherwise fetch data.json (works via any http(s):// host).
  if (!STATE.data) {
    try {
      const r = await fetch('data.json?v=' + Date.now());
      STATE.data = await r.json();
    } catch (e) {
      document.getElementById('main').innerHTML =
        '<div class="empty">Could not load data. Run <code>python3 scripts/build_data.py</code> to regenerate, then refresh.</div>';
      return;
    }
  }

  document.getElementById('asOfLabel').textContent = '· ' + STATE.data.asOf;
  renderCaveats();
  renderSearchIndex();
  setupEvents();
  render();
}

document.addEventListener('DOMContentLoaded', boot);

// ============================================================================
// Helpers
// ============================================================================
const COLORS = {}; // populated from data on boot
function catColor(c) {
  if (Object.keys(COLORS).length === 0 && STATE.data) Object.assign(COLORS, STATE.data.categoryColors);
  return COLORS[c] || '#5a5a5a';
}

function fmtPct(p, decimals = 1) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  return (p * 100).toFixed(decimals) + '%';
}
function fmtDollarsM(m, decimals = 1) {
  if (m === null || m === undefined || isNaN(m)) return '—';
  if (m >= 1000) return '$' + (m / 1000).toFixed(decimals) + 'B';
  if (m === 0) return '$0';
  return '$' + m.toFixed(decimals) + 'M';
}
function fmtDollarsB(b, decimals = 2) {
  if (b === null || b === undefined || isNaN(b)) return '—';
  return '$' + b.toFixed(decimals) + 'B';
}
function fundsWithHoldings() { return visibleFunds().filter(f => f.hasHoldings); }
function findFund(nameOrShort) {
  const all = [...STATE.data.funds, ...STATE.customFunds];
  return all.find(f => f.name === nameOrShort || f.shortLabel === nameOrShort);
}
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Build ticker index: { ticker -> [{fund, holding}] }
// ---------------------------------------------------------------------------
// Reusable sortable-header helpers for the dashboard tables.
// ---------------------------------------------------------------------------
function sortableTh(col, label, isNum, tableId) {
  const cur = STATE.dashSort[tableId] || {};
  const active = cur.col === col;
  const arrow = active ? (cur.dir === 'asc' ? '▲' : '▼') : '';
  const cls = `sortable${isNum ? ' num' : ''}${active ? ' sort-active' : ''}`;
  return `<th class="${cls}" data-sort="${col}" style="cursor:pointer; user-select:none">${label}${arrow ? `<span style="color:var(--accent); margin-left:4px">${arrow}</span>` : ''}</th>`;
}
function wireSortHeaders(tableEl, tableId, defaultSort, onChange) {
  tableEl.querySelectorAll('th.sortable[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      const cur = STATE.dashSort[tableId] || defaultSort;
      const numericCol = th.classList.contains('num');
      let next;
      if (cur.col === col) next = { col, dir: cur.dir === 'asc' ? 'desc' : 'asc' };
      else next = { col, dir: numericCol ? 'desc' : 'asc' };
      STATE.dashSort[tableId] = next;
      persistCustomizations();
      onChange();
    });
  });
}

let TICKER_INDEX = null;
function buildTickerIndex() {
  if (TICKER_INDEX) return TICKER_INDEX;
  TICKER_INDEX = new Map();
  for (const f of fundsWithHoldings()) {
    for (const h of f.holdings) {
      if (!passesMinPct(h)) continue;  // apply global min-position filter
      if (!TICKER_INDEX.has(h.ticker)) TICKER_INDEX.set(h.ticker, []);
      TICKER_INDEX.get(h.ticker).push({ fund: f, holding: h });
    }
  }
  return TICKER_INDEX;
}

// ============================================================================
// Router / render
// ============================================================================
function render() {
  // Highlight active tab
  document.querySelectorAll('nav.tabs a').forEach(a => {
    const r = a.dataset.route.replace(/^#\//, '').split('/')[0];
    a.classList.toggle('active', r === STATE.route.name);
  });
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (STATE.route.name === 'dashboard') renderDashboard(main);
  else if (STATE.route.name === 'funds') renderFundList(main);
  else if (STATE.route.name === 'fund') renderFundView(main, decodeURIComponent(STATE.route.arg || ''));
  else if (STATE.route.name === 'compare') renderCompare(main);
  else if (STATE.route.name === 'conviction') renderConviction(main);
  else renderDashboard(main);
}

// ============================================================================
// Dashboard
// ============================================================================
function renderDashboard(root) {
  const data = STATE.data;
  const funds = fundsWithHoldings();

  // Category filter
  const catFilter = document.createElement('div');
  catFilter.className = 'category-filter';
  const allChip = document.createElement('span');
  allChip.className = 'cat-chip' + (STATE.filterCategory === null ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { STATE.filterCategory = null; render(); };
  catFilter.appendChild(allChip);
  for (const c of data.categories) {
    const chip = document.createElement('span');
    chip.className = 'cat-chip' + (STATE.filterCategory === c ? ' active' : '');
    chip.innerHTML = `<span class="swatch" style="background:${catColor(c)}"></span>${c}`;
    chip.onclick = () => { STATE.filterCategory = (STATE.filterCategory === c) ? null : c; render(); };
    catFilter.appendChild(chip);
  }
  root.appendChild(catFilter);

  // EDGAR status panel (if results exist)
  if (STATE.edgarResults) {
    root.appendChild(renderEdgarStatus());
  }

  // Top names table
  root.appendChild(renderTopNamesCard());

  // Two-column: high-conviction + outsize bets
  const cols = document.createElement('div');
  cols.className = 'grid-2';
  cols.appendChild(renderHighConvictionCard());
  cols.appendChild(renderOutsizeBetsCard());
  root.appendChild(cols);

  // Fund snapshot grid
  root.appendChild(renderFundSnapshot());
}

// "Top names across all funds"
function renderTopNamesCard() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>Top names across all funds</h2>
    <div class="right">Click any header to sort · default = (# funds) × (median %)</div></div>
    <div id="topNamesBody"></div>`;

  const draw = () => {
    const idx = buildTickerIndex();
    const rows = [];
    for (const [ticker, list] of idx.entries()) {
      const cat = list[0].holding.category;
      if (STATE.filterCategory && cat !== STATE.filterCategory) continue;
      const pcts = list.map(x => x.holding.pct);
      const med = median(pcts);
      const maxObj = list.reduce((a, b) => b.holding.pct > a.holding.pct ? b : a);
      rows.push({
        ticker, issuer: list[0].holding.issuer, category: cat,
        numFunds: list.length, medianPct: med,
        maxPct: maxObj.holding.pct, maxFund: maxObj.fund.shortLabel,
        score: list.length * med,
      });
    }
    const sort = STATE.dashSort.topNames || { col: 'score', dir: 'desc' };
    const dir = sort.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      switch (sort.col) {
        case 'ticker':    return a.ticker.localeCompare(b.ticker) * dir;
        case 'category':  return a.category.localeCompare(b.category) * dir;
        case 'numFunds':  return (a.numFunds - b.numFunds) * dir;
        case 'medianPct': return (a.medianPct - b.medianPct) * dir;
        case 'maxPct':    return (a.maxPct - b.maxPct) * dir;
        case 'maxFund':   return a.maxFund.localeCompare(b.maxFund) * dir;
        case 'score':
        default:          return (a.score - b.score) * dir;
      }
    });
    const top = rows.slice(0, 30);
    const th = (col, label, num) => sortableTh(col, label, num, 'topNames');
    const tableHtml = `<table>
      <thead><tr>
        ${th('ticker','Ticker',false)}
        ${th('category','Category',false)}
        ${th('numFunds','# Funds',true)}
        ${th('medianPct','Median %',true)}
        ${th('maxPct','Max %',true)}
        ${th('maxFund','Max holder',false)}
      </tr></thead>
      <tbody>
      ${top.map(r => `
        <tr data-ticker="${r.ticker}">
          <td><span class="ticker">${r.ticker}</span></td>
          <td><span class="cat-chip"><span class="swatch" style="background:${catColor(r.category)}"></span>${r.category}</span></td>
          <td class="num">${r.numFunds}</td>
          <td class="num">${fmtPct(r.medianPct)}</td>
          <td class="num">${fmtPct(r.maxPct)}</td>
          <td data-fund="${escapeAttr(r.maxFund)}" style="color:var(--text-dim); cursor:pointer">${r.maxFund}</td>
        </tr>`).join('')}
      </tbody></table>`;
    const body = card.querySelector('#topNamesBody');
    body.innerHTML = tableHtml;
    wireSortHeaders(body.querySelector('table'), 'topNames', { col: 'score', dir: 'desc' }, draw);
    body.querySelectorAll('tbody tr').forEach(tr => {
      tr.addEventListener('click', e => {
        const fundCell = e.target.closest('td[data-fund]');
        if (fundCell) { e.stopPropagation(); navigateToFund(fundCell.dataset.fund); return; }
        openTickerDrawer(tr.dataset.ticker);
      });
    });
  };
  draw();
  return card;
}

// "High-conviction positions" — a single flat sortable table (was previously
// grouped by fund). One row per qualifying position.
function renderHighConvictionCard() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>High-conviction positions</h2>
    <div class="right">> 5% of 13F OR options notional > 50% of position · click to sort</div></div>
    <div id="hcBody"></div>`;

  const draw = () => {
    const rows = [];
    for (const f of fundsWithHoldings()) {
      for (const h of f.holdings) {
        if (STATE.filterCategory && h.category !== STATE.filterCategory) continue;
        const optShare = h.total > 0 ? (h.calls + h.puts) / h.total : 0;
        if (h.pct > 0.05 || optShare > 0.5) {
          rows.push({
            ticker: h.ticker, issuer: h.issuer, category: h.category,
            fund: f.shortLabel, isRef: f.isReference,
            pct: h.pct, optShare, calls: h.calls, puts: h.puts,
            reason: h.pct > 0.05 ? 'size' : 'leverage',
          });
        }
      }
    }
    const sort = STATE.dashSort.highConv || { col: 'pct', dir: 'desc' };
    const dir = sort.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      switch (sort.col) {
        case 'fund':     return a.fund.localeCompare(b.fund) * dir;
        case 'ticker':   return a.ticker.localeCompare(b.ticker) * dir;
        case 'category': return a.category.localeCompare(b.category) * dir;
        case 'optShare': return (a.optShare - b.optShare) * dir;
        case 'pct':
        default:         return (a.pct - b.pct) * dir;
      }
    });
    const th = (col, label, num) => sortableTh(col, label, num, 'highConv');
    const body = card.querySelector('#hcBody');
    if (!rows.length) {
      body.innerHTML = '<div class="empty">No high-conviction positions match the current filter.</div>';
      return;
    }
    body.innerHTML = `<table>
      <thead><tr>
        ${th('fund','Fund',false)}
        ${th('ticker','Ticker',false)}
        ${th('category','Category',false)}
        ${th('pct','% of 13F',true)}
        ${th('optShare','Opt %',true)}
        <th>Tag</th>
      </tr></thead>
      <tbody>
      ${rows.map(r => `
        <tr data-ticker="${r.ticker}">
          <td data-fund="${escapeAttr(r.fund)}" style="cursor:pointer; color:var(--text)">${r.fund}${r.isRef ? '<span class="badge sa">REF</span>' : ''}</td>
          <td><span class="ticker">${r.ticker}</span>${r.calls > 0 ? '<span class="badge calls">C</span>' : ''}${r.puts > 0 ? '<span class="badge puts">P</span>' : ''}</td>
          <td><span class="cat-chip"><span class="swatch" style="background:${catColor(r.category)}"></span>${r.category}</span></td>
          <td class="num">${fmtPct(r.pct)}</td>
          <td class="num">${fmtPct(r.optShare)}</td>
          <td>${r.reason === 'size' ? '<span class="badge high">SIZE</span>' : '<span class="badge calls">LEV</span>'}</td>
        </tr>`).join('')}
      </tbody></table>`;
    wireSortHeaders(body.querySelector('table'), 'highConv', { col: 'pct', dir: 'desc' }, draw);
    body.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', (e) => {
      const fundCell = e.target.closest('td[data-fund]');
      if (fundCell) { e.stopPropagation(); navigateToFund(fundCell.dataset.fund); return; }
      openTickerDrawer(tr.dataset.ticker);
    }));
  };
  draw();
  return card;
}

// "Outsize bets"
function renderOutsizeBetsCard() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>Outsize bets</h2>
    <div class="right">Allocations > 2× median · ≥2 holders · click to sort</div></div>
    <div id="outsizeBody"></div>`;

  const draw = () => {
    const idx = buildTickerIndex();
    const flags = [];
    for (const [ticker, list] of idx.entries()) {
      if (list.length < 2) continue;
      const cat = list[0].holding.category;
      if (STATE.filterCategory && cat !== STATE.filterCategory) continue;
      const pcts = list.map(x => x.holding.pct);
      const med = median(pcts);
      if (med <= 0) continue;
      for (const item of list) {
        const ratio = item.holding.pct / med;
        if (ratio > 2.0) {
          flags.push({ ticker, category: cat, fund: item.fund.shortLabel,
            pct: item.holding.pct, medianPct: med, ratio });
        }
      }
    }
    const sort = STATE.dashSort.outsize || { col: 'ratio', dir: 'desc' };
    const dir = sort.dir === 'asc' ? 1 : -1;
    flags.sort((a, b) => {
      switch (sort.col) {
        case 'ticker':    return a.ticker.localeCompare(b.ticker) * dir;
        case 'fund':      return a.fund.localeCompare(b.fund) * dir;
        case 'pct':       return (a.pct - b.pct) * dir;
        case 'medianPct': return (a.medianPct - b.medianPct) * dir;
        case 'ratio':
        default:          return (a.ratio - b.ratio) * dir;
      }
    });
    const th = (col, label, num) => sortableTh(col, label, num, 'outsize');
    let html;
    if (!flags.length) {
      html = '<div class="empty">No outsize bets match the current filter.</div>';
    } else {
      html = `<table>
        <thead><tr>
          ${th('ticker','Ticker',false)}
          ${th('fund','Fund',false)}
          ${th('pct','Their %',true)}
          ${th('medianPct','Median %',true)}
          ${th('ratio','Ratio',true)}
        </tr></thead>
        <tbody>
        ${flags.slice(0, 25).map(r => `
          <tr data-ticker="${r.ticker}">
            <td><span class="ticker">${r.ticker}</span></td>
            <td data-fund="${escapeAttr(r.fund)}" style="cursor:pointer">${r.fund}</td>
            <td class="num">${fmtPct(r.pct)}</td>
            <td class="num">${fmtPct(r.medianPct)}</td>
            <td class="num" style="color:${r.ratio > 4 ? 'var(--puts)' : 'var(--sa)'}">${r.ratio.toFixed(1)}×</td>
          </tr>`).join('')}
        </tbody></table>`;
    }
    const body = card.querySelector('#outsizeBody');
    body.innerHTML = html;
    if (flags.length) {
      wireSortHeaders(body.querySelector('table'), 'outsize', { col: 'ratio', dir: 'desc' }, draw);
    }
    body.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', e => {
      const fundCell = e.target.closest('td[data-fund]');
      if (fundCell) { e.stopPropagation(); navigateToFund(fundCell.dataset.fund); return; }
      openTickerDrawer(tr.dataset.ticker);
    }));
  };
  draw();
  return card;
}

// Fund snapshot grid
function renderFundSnapshot({ editable = false } = {}) {
  const card = document.createElement('div');
  card.className = 'card';
  const funds = visibleFunds();
  const filersN = funds.filter(f => f.hasHoldings).length;
  const nonFilersN = funds.length - filersN;
  const headerControls = editable ? `
    <button class="btn" id="manageBtn">${STATE.editMode ? 'Done' : 'Manage'}</button>
    <button class="btn" id="addFundBtn">+ Add fund</button>` : '';
  card.innerHTML = `<div class="card-header"><h2>Funds</h2>
    <div class="right" style="display:flex; gap:8px; align-items:center">${filersN} filers · ${nonFilersN} non-filers${STATE.hiddenCiks.size ? ` · <span style="color:var(--text-faint)">${STATE.hiddenCiks.size} hidden</span>` : ''} ${headerControls}</div></div>`;
  const grid = document.createElement('div');
  grid.className = 'fund-card-list';
  // Append an X-remove badge *after* innerHTML so it doesn't get wiped
  const attachRemoveX = (cardEl, fund) => {
    if (!editable || !STATE.editMode) return;
    const x = document.createElement('div');
    x.className = 'remove-x';
    x.textContent = '×';
    x.title = 'Hide this fund';
    x.onclick = (e) => {
      e.stopPropagation();
      if (!fund.cik) return;
      STATE.hiddenCiks.add(fund.cik);
      persistCustomizations();
      render();
    };
    cardEl.appendChild(x);
  };

  for (const f of funds) {
    const c = document.createElement('div');
    c.className = 'fund-card' + (f.isReference ? ' sa' : '') + (editable && STATE.editMode ? ' editable' : '');
    c.style.position = 'relative';
    if (!f.hasHoldings) {
      c.innerHTML = `
        <h4>${f.name} ${f.isReference ? '<span class="badge sa">REF</span>' : ''}</h4>
        <div class="manager">${f.manager}</div>
        <div style="font-size: 11px; color: var(--text-faint); padding: 6px 0">No standalone 13F filing.</div>
        <div style="font-size: 11px; color: var(--text-dim); margin-top:4px">${f.thesis || ''}</div>`;
      attachRemoveX(c, f);
      grid.appendChild(c);
      continue;
    }
    const eq = f.equityPct || 0, ca = f.callsPct || 0, pu = f.putsPct || 0;
    const period = f.periodOfReport || STATE.data.asOf;
    const isFresh = period > STATE.data.asOf;
    // Top 3 by size (% of 13F) — always computable from existing data
    const sorted = [...f.holdings].sort((a, b) => b.pct - a.pct);
    const topBySize = sorted.slice(0, 3);

    // Top 3 by 13W return — only positions with baked prices count, since
    // returns come from data.prices. Skip placeholder tickers.
    const withReturns = f.holdings
      .filter(h => !h.ticker.startsWith('?'))
      .map(h => {
        const r = STATE.data.prices?.[h.ticker]?.return13W;
        return r != null ? { ...h, ret: r } : null;
      })
      .filter(Boolean);
    const topByReturn = [...withReturns].sort((a, b) => b.ret - a.ret).slice(0, 3);
    const haveReturns = withReturns.length > 0;

    const sizeRows = topBySize.map(h => `
      <div class="mini-row" data-ticker="${h.ticker}">
        <span class="t">${h.ticker}</span>
        <span class="v">${fmtPct(h.pct)}</span>
      </div>`).join('');
    const returnRows = haveReturns
      ? topByReturn.map(h => {
          const color = h.ret >= 0 ? 'var(--calls)' : 'var(--puts)';
          const sign = h.ret >= 0 ? '+' : '';
          return `<div class="mini-row" data-ticker="${h.ticker}">
            <span class="t">${h.ticker}</span>
            <span class="v" style="color:${color}">${sign}${h.ret.toFixed(1)}%</span>
          </div>`;
        }).join('')
      : `<div class="mini-empty">no returns baked</div>`;

    c.innerHTML = `
      <h4>${f.shortLabel} ${f.isReference ? '<span class="badge sa">REF</span>' : ''}${f.optionsHeavy ? '<span class="badge calls">OPT-HEAVY</span>' : ''}${isFresh ? '<span class="badge new" title="Refreshed from SEC EDGAR">Q1 26</span>' : ''}</h4>
      <div class="manager">${f.manager} <span style="color:var(--text-faint)">· ${period}</span></div>
      <div class="meta">
        <div>13F <span class="v">${fmtDollarsB(f.totalBn)}</span></div>
        <div># issuers <span class="v">${f.numIssuers}</span></div>
        <div>Top 10 <span class="v">${fmtPct(f.top10Concentration, 0)}</span></div>
      </div>
      <div class="stacked-bar" title="Equity ${fmtPct(eq,0)} · Calls ${fmtPct(ca,0)} · Puts ${fmtPct(pu,0)}">
        <div class="seg eq" style="width:${(eq*100).toFixed(1)}%"></div>
        <div class="seg calls" style="width:${(ca*100).toFixed(1)}%"></div>
        <div class="seg puts" style="width:${(pu*100).toFixed(1)}%"></div>
      </div>
      <div class="mini-cols">
        <div class="mini-col">
          <div class="mini-head">Top 3 by size</div>
          ${sizeRows}
        </div>
        <div class="mini-col">
          <div class="mini-head">Top 3 by 13W return</div>
          ${returnRows}
        </div>
      </div>`;
    attachRemoveX(c, f);
    // Card click navigates to fund, but ticker clicks open the drawer
    c.onclick = (e) => {
      const row = e.target.closest('.mini-row[data-ticker]');
      if (row) { e.stopPropagation(); openTickerDrawer(row.dataset.ticker); return; }
      navigateToFund(f.shortLabel);
    };
    grid.appendChild(c);
  }
  // "+ Add fund" card at the end (Funds page only)
  if (editable) {
    const add = document.createElement('div');
    add.className = 'fund-card add-card';
    add.innerHTML = `<div class="plus">+</div><div>Add fund</div>`;
    add.onclick = openAddFundModal;
    grid.appendChild(add);
  }

  card.appendChild(grid);

  // Wire header buttons after the card is in the DOM
  if (editable) {
    setTimeout(() => {
      const mb = card.querySelector('#manageBtn');
      if (mb) mb.onclick = () => { STATE.editMode = !STATE.editMode; render(); };
      const ab = card.querySelector('#addFundBtn');
      if (ab) ab.onclick = openAddFundModal;
    }, 0);
  }

  return card;
}

function renderFundList(root) {
  // Header card with view toggle + management buttons
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const funds = visibleFunds();
  const filersN = funds.filter(f => f.hasHoldings).length;
  const nonFilersN = funds.length - filersN;
  wrap.innerHTML = `
    <div class="card-header">
      <h2>Funds</h2>
      <div class="right" style="display:flex; gap:8px; align-items:center">
        <span>${filersN} filers${nonFilersN ? ' · ' + nonFilersN + ' non-filers' : ''}${STATE.hiddenCiks.size ? ` · <span style="color:var(--text-faint)">${STATE.hiddenCiks.size} hidden</span>` : ''}</span>
        <div class="view-toggle">
          <button data-view="cards" class="${STATE.fundsView==='cards'?'active':''}">Cards</button>
          <button data-view="list" class="${STATE.fundsView==='list'?'active':''}">List</button>

        <button class="btn" id="manageBtn2">${STATE.editMode ? 'Done' : 'Manage'}</button>
        <button class="btn" id="addFundBtn2">+ Add fund</button>
      </div>
    </div>
    <div id="fundsBody"></div>`;
  root.appendChild(wrap);

  const body = wrap.querySelector('#fundsBody');

      render();

  });
  wrap.querySelector('#manageBtn2').onclick = () => { STATE.editMode = !STATE.editMode; render(); };

}

function drawFundsCardsView(container) {
  // Reuse the snapshot grid but stripped of its header (we already showed one)
  const snap = renderFundSnapshot({ editable: true });
  const grid = snap.querySelector('.fund-card-list');
  if (grid) container.appendChild(grid);
}

function drawFundsListView(container) {
  const funds = visibleFunds();
  const sort = STATE.fundsListSort || { col: 'totalBn', dir: 'desc' };
  const dir = sort.dir === 'asc' ? 1 : -1;

  // Compute per-fund derived fields (top-3 by size, top-3 by return) once
  const rows = funds.map(f => {
    const sorted = [...(f.holdings || [])].sort((a, b) => b.pct - a.pct);
    const topSize = sorted.slice(0, 3);
    const withReturns = (f.holdings || [])
      .filter(h => !h.ticker.startsWith('?'))
      .map(h => ({ ...h, ret: STATE.data.prices?.[h.ticker]?.return13W }))
      .filter(h => h.ret != null);
    const topReturn = [...withReturns].sort((a, b) => b.ret - a.ret).slice(0, 3);
    const bestReturn = topReturn[0]?.ret ?? null;
    return { f, topSize, topReturn, bestReturn };
  });

  rows.sort((a, b) => {
    const A = a.f, B = b.f;
    let av, bv;
    switch (sort.col) {
      case 'name':       av = (A.shortLabel || A.name || '').toLowerCase(); bv = (B.shortLabel || B.name || '').toLowerCase(); return av.localeCompare(bv) * dir;
      case 'manager':    av = (A.manager || '').toLowerCase(); bv = (B.manager || '').toLowerCase(); return av.localeCompare(bv) * dir;
      case 'period':     av = A.periodOfReport || ''; bv = B.periodOfReport || ''; return av.localeCompare(bv) * dir;
      case 'numIssuers': return ((A.numIssuers || 0) - (B.numIssuers || 0)) * dir;
      case 'top10':      return ((A.top10Concentration || 0) - (B.top10Concentration || 0)) * dir;
      case 'bestReturn': return ((a.bestReturn ?? -Infinity) - (b.bestReturn ?? -Infinity)) * dir;
      case 'totalBn':
      default:           return ((A.totalBn || 0) - (B.totalBn || 0)) * dir;
    }
  });

  const arrow = (col) => sort.col === col ? `<span class="sort-ind">${sort.dir==='asc'?'▲':'▼'}</span>` : '';
  const thClass = (col, extra='') => `${extra}${sort.col === col ? ' sort-active' : ''}`.trim();

  const miniCell = (items, useReturn = false) => {
    if (!items.length) return '<span style="color:var(--text-faint)">—</span>';
    return items.map(h => {
      if (useReturn) {
        const sign = h.ret >= 0 ? '+' : '';
        const color = h.ret >= 0 ? 'var(--calls)' : 'var(--puts)';
        return `<span class="mini-pair"><span class="ticker" data-ticker="${h.ticker}">${h.ticker}</span> <span class="pct" style="color:${color}">${sign}${h.ret.toFixed(0)}%</span></span>`;
      }
      return `<span class="mini-pair"><span class="ticker" data-ticker="${h.ticker}">${h.ticker}</span> <span class="pct">${fmtPct(h.pct, 0)}</span></span>`;
    }).join('');
  };

  const table = document.createElement('table');
  table.className = 'funds-list-table';
  table.innerHTML = `
    <thead><tr>
      <th data-sort="name" class="${thClass('name')}">Fund${arrow('name')}</th>
      <th data-sort="period" class="${thClass('period')}">Period${arrow('period')}</th>
      <th data-sort="totalBn" class="num ${thClass('totalBn','num')}">13F Total${arrow('totalBn')}</th>
      <th data-sort="numIssuers" class="num ${thClass('numIssuers','num')}"># Issuers${arrow('numIssuers')}</th>
      <th data-sort="top10" class="num ${thClass('top10','num')}">Top 10${arrow('top10')}</th>
      <th>Top 3 by size</th>
      <th data-sort="bestReturn" class="${thClass('bestReturn')}">Top 3 by 13W return${arrow('bestReturn')}</th>
      ${STATE.editMode ? '<th></th>' : ''}
    </tr></thead>
    <tbody>
    ${rows.map(({ f, topSize, topReturn }) => {
      const period = f.periodOfReport || STATE.data.asOf || '—';
      const total = f.totalBn != null ? fmtDollarsB(f.totalBn) : '—';
      const issuers = f.numIssuers ?? '—';
      const top10 = f.top10Concentration != null ? fmtPct(f.top10Concentration, 0) : '—';
      const removeCell = STATE.editMode
        ? `<td style="text-align:center"><span class="row-x" data-cik="${f.cik || ''}" title="Hide">×</span></td>`
        : '';
      return `<tr data-fund="${escapeAttr(f.shortLabel || f.name)}" class="${f.isReference ? 'sa-row' : ''}">
        <td>
          <div class="fund-name">${escapeHtml(f.shortLabel || f.name)} ${f.isReference?'<span class="badge sa">REF</span>':''}${f.optionsHeavy?'<span class="badge calls">OPT</span>':''}${f.sourceTag === 'edgar'?'<span class="badge new">EDGAR</span>':''}</div>
          <div class="fund-meta">${escapeHtml(f.manager || '')}${f.cik ? ` · CIK ${f.cik}` : ''}</div>
        </td>
        <td><span style="font-family: var(--font-mono); color: var(--text-dim); font-size: 11px">${period}</span></td>
        <td class="num">${total}</td>
        <td class="num">${issuers}</td>
        <td class="num">${top10}</td>
        <td class="mini-cell">${miniCell(topSize)}</td>
        <td class="mini-cell">${miniCell(topReturn, true)}</td>
        ${removeCell}
      </tr>`;
    }).join('')}
    </tbody>`;
  container.appendChild(table);

  // Wire header sort
  table.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      const current = STATE.fundsListSort;
      const numericDefaults = ['totalBn', 'numIssuers', 'top10', 'bestReturn'];
      let next;
      if (current?.col === col) next = { col, dir: current.dir === 'asc' ? 'desc' : 'asc' };
      else next = { col, dir: numericDefaults.includes(col) ? 'desc' : 'asc' };
      STATE.fundsListSort = next;
      persistCustomizations();
      render();
    });
  });

  // Wire row click → fund view (but not when clicking ticker or X)
  table.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', (e) => {
      const tEl = e.target.closest('.ticker[data-ticker]');
      if (tEl) { e.stopPropagation(); openTickerDrawer(tEl.dataset.ticker); return; }
      const xEl = e.target.closest('.row-x');
      if (xEl) {
        e.stopPropagation();
        const cik = xEl.dataset.cik;
        if (cik) { STATE.hiddenCiks.add(cik); persistCustomizations(); render(); }
        return;
      }
      navigateToFund(tr.dataset.fund);
    });
  });
}

async function openAddFundModal() {
  let overlay = document.getElementById('addFundOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'addFundOverlay';
    overlay.innerHTML = `
      <div class="modal" role="dialog">
        <div class="modal-header">
          <h3>Add fund from SEC EDGAR</h3>
          <button class="drawer-close" id="addFundClose">×</button>
        </div>
        <div class="modal-body">
          <input class="search" id="addFundInput" placeholder="Search fund name (e.g. Renaissance Technologies)" autofocus />
          <div class="results" id="addFundResults"></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeAddFundModal(); });
    overlay.querySelector('#addFundClose').onclick = closeAddFundModal;
    const inp = overlay.querySelector('#addFundInput');
    let debounce;
    inp.addEventListener('input', () => {
      clearTimeout(debounce);

}
function closeAddFundModal() {
  const o = document.getElementById('addFundOverlay');
  if (o) o.classList.remove('show');
}

async function runAddFundSearch(query) {
  const results = document.getElementById('addFundResults');
  if (!query || query.length < 2) { results.innerHTML = ''; return; }
  results.innerHTML = '<div style="color:var(--text-faint); font-size:11px">searching…</div>';
  try {
    // Call our /api/search proxy — SEC's efts.sec.gov doesn't set CORS headers,
    // so the browser can't hit it directly.
    const r = await fetch('/api/search?q=' + encodeURIComponent(query));
    if (!r.ok) {
      let body = ''; try { body = (await r.json()).error || ''; } catch (_) {}
      throw new Error(body || ('HTTP ' + r.status));
    }
    const d = await r.json();
    const hits = d.results || [];
    if (!hits.length) {
      results.innerHTML = '<div style="color:var(--text-faint); font-size:11px">No matches.</div>';
      return;
    }
    results.innerHTML = '';
    for (const { cik, name } of hits) {
      const already = STATE.data.funds.find(f => f.cik === cik) || STATE.customFunds.find(f => f.cik === cik);
      const row = document.createElement('div');
      row.className = 'result';
      row.innerHTML = `
        <span class="name">${escapeHtml(name)}</span>
        <span class="meta-r">CIK ${cik}${already ? ' · already added' : ''}</span>`;
      if (already) {
        row.style.opacity = 0.5; row.style.cursor = 'default';
      } else {
        row.onclick = () => addFundByCik(cik, name, row);
      }
      results.appendChild(row);
    }
  } catch (e) {
    results.innerHTML = `<div style="color:var(--puts)">Search failed: ${escapeHtml(e.message)}</div>`;
  }
}

async function addFundByCik(cik, displayName, rowEl) {
  rowEl.style.opacity = 0.6;
  rowEl.innerHTML = `<span class="name">${escapeHtml(displayName)}</span><span class="meta-r">fetching 13F…</span>`;
  try {
    const r = await fetch(`/api/edgar?full=1&ciks=${cik}`);
    if (!r.ok) throw new Error('API ' + r.status);
    const data = await r.json();
    const fund = (data.funds_full || [])[0];
    if (!fund) {
      const errMsg = (data.errors || data.funds || [])[0]?.error || 'No 13F-HR available';
      throw new Error(errMsg);
    }
    // Make sure it has a stable shortLabel
    fund.shortLabel = fund.shortLabel || displayName.replace(/\s*\(CIK\s+\d+\)$/i, '').split(/[,()]/)[0].trim().slice(0, 24);
    STATE.customFunds.push(fund);
    STATE.hiddenCiks.delete(cik);  // un-hide if previously hidden
    persistCustomizations();
    TICKER_INDEX = null;            // invalidate cached index
    closeAddFundModal();
    render();
  } catch (e) {
    rowEl.style.opacity = 1;
    rowEl.innerHTML = `<span class="name">${escapeHtml(displayName)}</span><span class="meta-r" style="color:var(--puts)">${escapeHtml(e.message)}</span>`;
  }
}

// ---------------------------------------------------------------------------
// Price helpers
//
// We use Finnhub's pre-computed price returns (13W / 26W / 52W) as a proxy
// for "% change since reporting date." Finnhub's free tier doesn't expose
// arbitrary historical close prices, so we pick the closest stock window
// based on the fund's filing period:
//   - Q1 2026 (period 2026-03-31): use 13W return  (actual gap is ~7w)
//   - Q4 2025 (period 2025-12-31): use 26W return  (actual gap is ~20w)
//   - older: fall back to 26W
// The window used is shown in the column header and per-row tooltip.
// ---------------------------------------------------------------------------
async function loadCurrentPricesForFund(fund) {
  const tickers = [...new Set(fund.holdings.map(h => h.ticker).filter(t => /^[A-Z][A-Z0-9.\-]{0,6}$/.test(t)))];
  if (!tickers.length) return;
  STATE.pricesFetching = true;
  STATE.pricesError = null;
  // When opened via file:// there's no server, so /api/prices is unreachable.
  // Surface that with a clearer message than the browser's "Failed to fetch".
  if (location.protocol === 'file:') {
    STATE.pricesError = 'Returns require a running server (npm start) — opened via file://, /api/prices is unreachable.';
    STATE.pricesFetching = false;
    return;
  }
  try {
    const r = await fetch('/api/prices?tickers=' + encodeURIComponent(tickers.join(',')));
    if (!r.ok) {
      let detail = '';
      try { const body = await r.json(); detail = body.error ? ` (${body.error})` : ''; } catch (_) {}
      if (r.status === 500 && /FINNHUB/i.test(detail)) {
        throw new Error('Server missing FINNHUB_API_KEY env var — set it in Render → Environment.');
      }
      throw new Error(`/api/prices HTTP ${r.status}${detail}`);
    }
    const data = await r.json();
    Object.assign(STATE.currentPrices, data.prices || {});
    if (data.errors?.length) {
      console.warn('[prices] partial errors:', data.errors);
    }
  } catch (e) {
    STATE.pricesError = e.message;
  } finally {
    STATE.pricesFetching = false;
  }
}

// Map a fund's period-of-report to the closest Finnhub return window.
// Returns { field, label, windowDays } describing which metric to use.
function pickReturnWindow(periodStr) {
  const today = new Date();
  const period = new Date(periodStr + 'T00:00:00Z');
  const days = Math.max(1, Math.floor((today - period) / 86400000));
  if (days <= 21)  return { field: 'return5D',  label: '5D',  windowDays: 5 };
  if (days <= 75)  return { field: 'return13W', label: '13W', windowDays: 91 };
  if (days <= 150) return { field: 'return26W', label: '26W', windowDays: 182 };
  return { field: 'return52W', label: '52W', windowDays: 365 };
}

function pctSinceReport(fund, h) {
  const period = fund.periodOfReport || STATE.data.asOf;
  const win = pickReturnWindow(period);
  const p = STATE.currentPrices?.[h.ticker];
  if (!p) return null;
  const r = p[win.field];
  if (r == null || isNaN(r)) return null;
  return r / 100;  // Finnhub returns are in percent (e.g. 20.53 -> 0.2053)
}

// Fund-level aggregate — equity-weighted average price change.
// Options notional is excluded because option P&L isn't linear in spot price.
function fundEquityGrowth(fund) {
  let wSum = 0, weighted = 0;
  for (const h of fund.holdings) {
    const pct = pctSinceReport(fund, h);
    if (pct == null || !h.equity) continue;
    wSum += h.equity;
    weighted += h.equity * pct;
  }
  return wSum > 0 ? { pct: weighted / wSum, coverage: wSum } : null;
}

function updateGrowthStat(fund) {
  const stat = document.getElementById('growthStat');
  if (!stat) return;
  const period = fund.periodOfReport || STATE.data.asOf;
  const win = pickReturnWindow(period);
  const coverageEquity = fund.holdings.reduce((s, h) => s + (h.equity || 0), 0);
  const growth = fundEquityGrowth(fund);
  if (STATE.pricesError) {
    stat.querySelector('.value').textContent = '—';
    stat.querySelector('.sub').textContent = STATE.pricesError;
    stat.querySelector('.sub').style.color = 'var(--puts)';
    return;
  }
  if (!growth) {
    stat.querySelector('.value').textContent = '—';
    stat.querySelector('.sub').textContent = 'no prices available · check FINNHUB_API_KEY env var';
    return;
  }
  const v = stat.querySelector('.value');
  const sign = growth.pct >= 0 ? '+' : '';
  v.textContent = `${sign}${(growth.pct * 100).toFixed(1)}%`;
  v.style.color = growth.pct >= 0 ? 'var(--calls)' : 'var(--puts)';
  const cov = coverageEquity > 0 ? growth.coverage / coverageEquity : 0;
  stat.querySelector('.sub').textContent = `equity-weighted ${win.label} return · covers ${(cov * 100).toFixed(0)}% of equity book`;
  stat.querySelector('.sub').style.color = 'var(--text-dim)';
}

function drawFundTable(container, fund) {
  let holdings = fund.holdings.filter(passesMinPct).sort((a, b) => b.pct - a.pct);
  if (STATE.fundViewMode === 'top10') holdings = holdings.slice(0, 10);

  if (STATE.fundViewMode === 'byCategory') {
    // Group by category
    const groups = {};
    for (const h of holdings) (groups[h.category] = groups[h.category] || []).push(h);
    let html = '';
    for (const [cat, items] of Object.entries(groups).sort((a, b) => {
      const sa = a[1].reduce((s, h) => s + h.pct, 0);
      const sb = b[1].reduce((s, h) => s + h.pct, 0);
      return sb - sa;
    })) {
      const total = items.reduce((s, h) => s + h.pct, 0);
      html += `<div class="section">
        <div class="section-title">
          <span class="cat-chip"><span class="swatch" style="background:${catColor(cat)}"></span>${cat}</span>
          <span class="sub">${items.length} positions · ${fmtPct(total)} of 13F</span>
        </div>
        ${holdingsTableHtml(items, fund)}
      </div>`;
    }
    container.innerHTML = html;
  } else {
    container.innerHTML = holdingsTableHtml(holdings, fund);
  }

  container.querySelectorAll('tbody tr').forEach(tr =>
    tr.addEventListener('click', () => openTickerDrawer(tr.dataset.ticker)));
}

function holdingsTableHtml(rows, fund) {
  // Resolve fund (drawFundTable passes it; if not provided, find via shortLabel route)
  if (!fund) fund = findFund(STATE.route.arg);
  const period = fund?.periodOfReport || STATE.data.asOf;
  const win = pickReturnWindow(period);
  const renderGrowth = (h) => {
    const pct = pctSinceReport(fund, h);
    if (pct == null) {
      if (STATE.pricesFetching) return '<span style="color:var(--text-faint)">…</span>';
      const tip = STATE.pricesError
        ? STATE.pricesError
        : h.ticker.startsWith('?')
          ? 'Unresolved ticker — issuer name didn\'t map to a symbol'
          : 'No return data from Finnhub for this ticker';
      return `<span style="color:var(--text-faint)" title="${escapeAttr(tip)}">—</span>`;
    }
    const sign = pct >= 0 ? '+' : '';
    const color = pct >= 0 ? 'var(--calls)' : 'var(--puts)';
    const p = STATE.currentPrices?.[h.ticker];
    const tip = p
      ? `${win.label} return (proxy for change since ${period}). Current price: $${p.price.toFixed(2)} as of ${p.asOf}`
      : '';
    return `<span style="color:${color}" title="${escapeAttr(tip)}">${sign}${(pct * 100).toFixed(1)}%</span>`;
  };

  return `<table>
    <thead><tr>
      <th>#</th><th>Ticker</th><th>Issuer</th><th>Category</th>
      <th class="num">Equity</th><th class="num">Calls</th><th class="num">Puts</th>
      <th class="num">Total</th><th class="num">% of 13F</th>
      <th class="num" title="${win.label} price return — proxy for change since ${period}. Finnhub's free tier doesn't expose arbitrary historical dates; this is the closest pre-computed window.">${win.label} return</th>
      <th style="width:80px">Allocation</th>
    </tr></thead>
    <tbody>
    ${rows.map((h, i) => `
      <tr data-ticker="${h.ticker}">
        <td style="color:var(--text-faint)">${i + 1}</td>
        <td><span class="ticker">${h.ticker}</span>${h.calls > 0 ? '<span class="badge calls">C</span>' : ''}${h.puts > 0 ? '<span class="badge puts">P</span>' : ''}</td>
        <td style="color:var(--text-dim)">${escapeHtml(h.issuer)}</td>
        <td><span class="cat-chip"><span class="swatch" style="background:${catColor(h.category)}"></span>${h.category}</span></td>
        <td class="num">${fmtDollarsM(h.equity)}</td>
        <td class="num" style="${h.calls>0?'color:var(--calls)':''}">${fmtDollarsM(h.calls)}</td>
        <td class="num" style="${h.puts>0?'color:var(--puts)':''}">${fmtDollarsM(h.puts)}</td>
        <td class="num">${fmtDollarsM(h.total)}</td>
        <td class="num">${fmtPct(h.pct)}</td>
        <td class="num">${renderGrowth(h)}</td>
        <td><div class="bar-thin" style="width:60px"><div class="fill" style="width:${Math.min(100, h.pct * 100 / 0.22 * 100).toFixed(0)}%; background:${catColor(h.category)}"></div></div></td>
      </tr>`).join('')}
    </tbody></table>`;
}

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>Compare funds</h2>
    <div class="right">Select up to 4</div></div>`;
