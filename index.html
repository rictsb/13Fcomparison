  picker.className = 'fund-picker';
  for (const f of fundsWithHoldings()) {
    const checked = STATE.compareSelection.has(f.shortLabel);
    const lbl = document.createElement('label');
    lbl.className = checked ? 'checked' : '';
    lbl.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}> <span>${f.shortLabel}</span> <span style="color:var(--text-faint); font-size: 10px; margin-left:auto">${fmtDollarsB(f.totalBn)}</span>`;
    lbl.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) {
        if (STATE.compareSelection.size >= 4) { e.target.checked = false; return; }
        STATE.compareSelection.add(f.shortLabel);
      } else STATE.compareSelection.delete(f.shortLabel);
      // Selection changed — fund column indices shift, so reset sort state.
      STATE.compareSort = { common: null, divergent: null };
      render();
    });
    picker.appendChild(lbl);
  }
  card.appendChild(picker);
  root.appendChild(card);

  if (STATE.compareSelection.size < 2) {
    const hint = document.createElement('div');
    hint.className = 'empty';
    hint.textContent = 'Pick 2-4 funds above to compare.';
    root.appendChild(hint);
    return;
  }

  const selected = [...STATE.compareSelection].map(s => findFund(s)).filter(Boolean);

  // Category allocation bars
  const allocCard = document.createElement('div');
  allocCard.className = 'card';
  allocCard.innerHTML = `<h2>Category allocation</h2>`;
  const cats = STATE.data.categories;
  const allocBars = document.createElement('div');
  allocBars.className = 'compare-bars';
  for (const f of selected) {
    const totals = {};
    let grand = 0;
    for (const h of f.holdings) {
      if (!passesMinPct(h)) continue;
      totals[h.category] = (totals[h.category] || 0) + h.pct;
      grand += h.pct;
    }
    const segs = cats.filter(c => totals[c] > 0).map(c => {
      const pct = totals[c] / (grand || 1);
      return `<div class="seg" style="width:${(pct*100).toFixed(1)}%; background:${catColor(c)}" title="${c}: ${fmtPct(pct,1)}"></div>`;
    }).join('');
    const row = document.createElement('div');
    row.className = 'compare-bar-row';
    row.innerHTML = `<div class="label">${f.shortLabel}<div style="font-size:10px; color:var(--text-faint)">${fmtDollarsB(f.totalBn)} · ${f.numIssuers} issuers</div></div>
      <div class="compare-bar">${segs}</div>`;
    allocBars.appendChild(row);
  }
  allocCard.appendChild(allocBars);
  // Legend
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.style.marginTop = '12px';
  for (const c of cats) legend.innerHTML += `<div><span class="swatch" style="background:${catColor(c)}"></span>${c}</div>`;
  allocCard.appendChild(legend);
  root.appendChild(allocCard);

  // Common & divergence
  const common = [], divergent = [];
  const tickerSets = selected.map(f => new Map(f.holdings.map(h => [h.ticker, h])));
  const allTickers = new Set();
  tickerSets.forEach(m => m.forEach((_, k) => allTickers.add(k)));
  for (const t of allTickers) {
    const presence = tickerSets.map(m => m.get(t));
    const heldBy = presence.filter(Boolean).length;
    if (heldBy === selected.length) common.push({ ticker: t, presence });
    else if (heldBy >= 2) divergent.push({ ticker: t, presence, heldBy });
  }
  common.sort((a, b) => {
    const sa = a.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    const sb = b.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    return sb - sa;
  });
  divergent.sort((a, b) => b.heldBy - a.heldBy || (() => {
    const sa = a.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    const sb = b.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    return sb - sa;
  })());

  const commonCard = document.createElement('div');
  commonCard.className = 'card';
  commonCard.dataset.tableId = 'common';
  commonCard.innerHTML = `<div class="card-header"><h2>Common holdings</h2>
    <div class="right">${common.length} tickers held by all ${selected.length}</div></div>
    <div class="compare-table-wrap"></div>`;
  root.appendChild(commonCard);
  drawComparisonTable(commonCard.querySelector('.compare-table-wrap'), 'common', common, selected, false);

  const divCard = document.createElement('div');
  divCard.className = 'card';
  divCard.dataset.tableId = 'divergent';
  divCard.innerHTML = `<div class="card-header"><h2>Divergence — held by some, not all</h2>
    <div class="right">${divergent.length} tickers</div></div>
    <div class="compare-table-wrap"></div>`;
  root.appendChild(divCard);
  drawComparisonTable(divCard.querySelector('.compare-table-wrap'), 'divergent', divergent, selected, true);
}

// Default sort = "score" (sum of allocations across selected funds, desc)
function defaultCompareSort(showHeldBy) {
  return { col: 'score', dir: 'desc' };
}

function drawComparisonTable(container, tableId, rows, selected, showHeldBy) {
  if (!rows.length) { container.innerHTML = '<div class="empty">None.</div>'; return; }

  // Active sort state — fall back to default
  const sort = STATE.compareSort[tableId] || defaultCompareSort(showHeldBy);

  // Sort rows
  const cmp = (a, b) => {
    const dir = sort.dir === 'asc' ? 1 : -1;
    let av, bv;
    if (sort.col === 'ticker') { av = a.ticker; bv = b.ticker; return av.localeCompare(bv) * dir; }
    if (sort.col === 'category') {
      av = (a.presence.find(Boolean) || {}).category || 'Other';
      bv = (b.presence.find(Boolean) || {}).category || 'Other';
      return av.localeCompare(bv) * dir;
    }
    if (sort.col === 'heldBy') { return ((a.heldBy || 0) - (b.heldBy || 0)) * dir; }
    if (sort.col === 'score') {
      av = a.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
      bv = b.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
      return (av - bv) * dir;
    }
    // Per-fund column — col is the fund index "fund:0", "fund:1", ...
    if (sort.col.startsWith('fund:')) {
      const idx = parseInt(sort.col.split(':')[1], 10);
      // Treat missing positions as -1 so they sort to the bottom on desc
      av = a.presence[idx] ? a.presence[idx].pct : -1;
      bv = b.presence[idx] ? b.presence[idx].pct : -1;
      return (av - bv) * dir;
    }
    return 0;
  };
  const sorted = [...rows].sort(cmp);

  const arrow = (col) => sort.col === col
    ? `<span class="sort-ind">${sort.dir === 'asc' ? '▲' : '▼'}</span>`
    : '<span class="sort-ind"></span>';
  const thClass = (col) => 'sortable' + (sort.col === col ? ' sort-active' : '');

  const html = `<table>
    <thead><tr>
      <th class="${thClass('ticker')}" data-sort="ticker">Ticker${arrow('ticker')}</th>
      <th class="${thClass('category')}" data-sort="category">Category${arrow('category')}</th>
      ${selected.map((f, i) => `<th class="num ${thClass('fund:'+i)}" data-sort="fund:${i}">${f.shortLabel}${arrow('fund:'+i)}</th>`).join('')}
      ${showHeldBy ? `<th class="num ${thClass('heldBy')}" data-sort="heldBy"># holders${arrow('heldBy')}</th>` : ''}
    </tr></thead>
    <tbody>
    ${sorted.slice(0, 80).map(r => {
      const cat = (r.presence.find(Boolean) || {}).category || 'Other';
      return `<tr data-ticker="${r.ticker}">
        <td><span class="ticker">${r.ticker}</span></td>
        <td><span class="cat-chip"><span class="swatch" style="background:${catColor(cat)}"></span>${cat}</span></td>
        ${r.presence.map(p => `<td class="num">${p ? fmtPct(p.pct) : '<span style="color:var(--text-faint)">—</span>'}</td>`).join('')}
        ${showHeldBy ? `<td class="num">${r.heldBy}</td>` : ''}
      </tr>`;
    }).join('')}
    </tbody></table>`;
  container.innerHTML = html;

  // Wire header clicks: toggle asc <-> desc on same column, switch to desc on new column
  container.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      const current = STATE.compareSort[tableId];
      let next;
      if (current && current.col === col) {
        next = { col, dir: current.dir === 'asc' ? 'desc' : 'asc' };
      } else {
        // Numeric columns default to descending (biggest first), text columns to ascending
        const numericDefault = col.startsWith('fund:') || col === 'heldBy' || col === 'score';
        next = { col, dir: numericDefault ? 'desc' : 'asc' };
      }
      STATE.compareSort[tableId] = next;
      drawComparisonTable(container, tableId, rows, selected, showHeldBy);
    });
  });

  // Re-wire ticker clicks (they get torn down on re-render)
  container.querySelectorAll('tbody tr[data-ticker]').forEach(tr =>
    tr.addEventListener('click', () => openTickerDrawer(tr.dataset.ticker)));
}

// ============================================================================
// Conviction map — concentration (max %) vs. consensus (# funds holding)
// ============================================================================
function buildConvictionData() {
  const idx = buildTickerIndex();
  const out = [];
  for (const [ticker, list] of idx.entries()) {
    const cat = list[0].holding.category;
    if (STATE.filterCategory && cat !== STATE.filterCategory) continue;
    const maxHolder = list.reduce((a, b) => b.holding.pct > a.holding.pct ? b : a);
    const totalUsd = list.reduce((s, x) => s + x.holding.total, 0);
    const medianPct = median(list.map(x => x.holding.pct));
    out.push({
      ticker,
      issuer: list[0].holding.issuer,
      category: cat,
      numFunds: list.length,
      maxPct: maxHolder.holding.pct,
      medianPct,
      totalUsd,
      maxFund: maxHolder.fund.shortLabel,
      holders: list,
    });
  }
  return out;
}

function renderConviction(root) {
  // ----- Category filter chips -----
  const catFilter = document.createElement('div');
  catFilter.className = 'category-filter';
  const allChip = document.createElement('span');
  allChip.className = 'cat-chip' + (STATE.filterCategory === null ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { STATE.filterCategory = null; render(); };
  catFilter.appendChild(allChip);
  for (const c of STATE.data.categories) {
    const chip = document.createElement('span');
    chip.className = 'cat-chip' + (STATE.filterCategory === c ? ' active' : '');
    chip.innerHTML = `<span class="swatch" style="background:${catColor(c)}"></span>${c}`;
    chip.onclick = () => { STATE.filterCategory = (STATE.filterCategory === c) ? null : c; render(); };
    catFilter.appendChild(chip);
  }
  root.appendChild(catFilter);

  // ----- Layout: chart left, side panels right -----
  const wrap = document.createElement('div');
  wrap.className = 'conviction-wrap';
  root.appendChild(wrap);

  const data = buildConvictionData();

  // ----- Chart card -----
  const chartCard = document.createElement('div');
  chartCard.className = 'conviction-chart';
  chartCard.innerHTML = `
    <div class="card-header" style="margin-bottom:0">
      <h2>Conviction map</h2>
      <div class="right">Concentration (max % in any fund) vs. Consensus (# of funds holding)</div>
    </div>
    <div id="convictionSvgWrap" style="position:relative; margin-top: 8px"></div>
    <div class="legend" style="margin-top:8px">
      ${STATE.data.categories.map(c => `<div><span class="swatch" style="background:${catColor(c)}"></span>${c}</div>`).join('')}
      <div style="margin-left:auto; color: var(--text-faint)">Dot size = total $ across funds</div>
    </div>`;
  wrap.appendChild(chartCard);
  drawConvictionChart(chartCard.querySelector('#convictionSvgWrap'), data);

  // ----- Side panels -----
  const side = document.createElement('div');
  side.className = 'conviction-side';
  wrap.appendChild(side);

  // Lonely conviction: a name qualifies if EITHER
  //   (a) held by ≤2 funds at >5%, OR
  //   (b) top holder is at >10% AND >3x the median holder's allocation
  //       (catches names like CRWV: 3 holders but SA is 4-5x larger than the rest)
  const lonely = data
    .filter(d => {
      const ratio = d.medianPct > 0 ? d.maxPct / d.medianPct : Infinity;
      const a = d.numFunds <= 2 && d.maxPct > 0.05;
      const b = d.maxPct > 0.10 && ratio > 3;
      return a || b;
    })
    .sort((a, b) => b.maxPct - a.maxPct)
    .slice(0, 12);
  const lonelyCard = document.createElement('div');
  lonelyCard.className = 'card';
  lonelyCard.innerHTML = `
    <div class="card-header"><h2>Lonely conviction</h2>
      <div class="right">Few holders OR one fund far ahead of peers</div></div>
    <div style="font-size: 11px; color: var(--text-faint); margin-bottom: 8px">≤ 2 holders at &gt;5%, or top holder at &gt;10% AND &gt;3× the median.</div>`;
  if (!lonely.length) {
    lonelyCard.innerHTML += '<div class="empty">No matches with current filter.</div>';
  } else {
    const ul = document.createElement('ul');
    ul.className = 'conviction-list';
    for (const d of lonely) {
      const li = document.createElement('li');
      li.dataset.ticker = d.ticker;
      const ratio = d.medianPct > 0 ? (d.maxPct / d.medianPct).toFixed(1) + '×' : '—';
      const peerCount = d.numFunds === 1
        ? 'solo holder'
        : `${d.numFunds} holders · ${ratio} vs. median`;
      li.innerHTML = `
        <div><span class="ticker">${d.ticker}</span></div>
        <div>
          <div style="color: var(--text); font-weight: 500">${d.maxFund}</div>
          <div class="lc-meta"><span class="cat-chip" style="font-size: 9px; padding: 1px 5px"><span class="swatch" style="background:${catColor(d.category)}"></span>${d.category}</span> · ${peerCount}</div>
        </div>
        <div class="lc-pct">${fmtPct(d.maxPct)}</div>`;
      li.onclick = () => openTickerDrawer(d.ticker);
      ul.appendChild(li);
    }
    lonelyCard.appendChild(ul);
  }
  side.appendChild(lonelyCard);

  // Crowded mega-bets: ≥5 funds AT >5% median
  const crowded = data
    .filter(d => d.numFunds >= 5 && d.medianPct > 0.05)
    .sort((a, b) => b.medianPct * b.numFunds - a.medianPct * a.numFunds)
    .slice(0, 10);
  const crowdedCard = document.createElement('div');
  crowdedCard.className = 'card';
  crowdedCard.innerHTML = `
    <div class="card-header"><h2>Crowded mega-bets</h2>
      <div class="right">≥ 5 holders · median &gt;5%</div></div>
    <div style="font-size: 11px; color: var(--text-faint); margin-bottom: 8px">The consensus AI trades — high agreement and high conviction together.</div>`;
  if (!crowded.length) {
    crowdedCard.innerHTML += '<div class="empty">No matches with current filter.</div>';
  } else {
    const ul = document.createElement('ul');
    ul.className = 'conviction-list';
    for (const d of crowded) {
      const li = document.createElement('li');
      li.dataset.ticker = d.ticker;
      li.innerHTML = `
        <div><span class="ticker">${d.ticker}</span></div>
        <div>
          <div style="color: var(--text); font-weight: 500">${d.numFunds} funds</div>
          <div class="lc-meta"><span class="cat-chip" style="font-size: 9px; padding: 1px 5px"><span class="swatch" style="background:${catColor(d.category)}"></span>${d.category}</span></div>
        </div>
        <div class="lc-pct">${fmtPct(d.medianPct)}</div>`;
      li.onclick = () => openTickerDrawer(d.ticker);
      ul.appendChild(li);
    }
    crowdedCard.appendChild(ul);
  }
  side.appendChild(crowdedCard);
}

function drawConvictionChart(container, data) {
  // Chart dims
  const W = 920, H = 540;
  const M = { top: 30, right: 30, bottom: 50, left: 60 };
  const PW = W - M.left - M.right;
  const PH = H - M.top - M.bottom;

  // Scales
  const maxFunds = Math.max(8, ...data.map(d => d.numFunds));
  const maxPct = Math.max(0.25, ...data.map(d => d.maxPct));
  const niceMax = Math.ceil(maxPct * 20) / 20; // round up to nearest 5%
  const xOf = n => M.left + ((n - 0.5) / maxFunds) * PW;
  const yOf = p => M.top + PH - (p / niceMax) * PH;

  // Dot size by total $ — sqrt scale, jittered to avoid all-tiny dots when totals are small
  const maxUsd = Math.max(1, ...data.map(d => d.totalUsd));
  const rOf = u => 5 + Math.sqrt(u / maxUsd) * 22;

  // Quadrant cutoffs: 5% conviction line, ~half the funds for consensus
  const convictionLineY = yOf(0.05);
  const consensusLineX = xOf(Math.ceil(maxFunds / 2));

  // Build SVG
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // Grid + ticks
  const yTicks = [];
  for (let p = 0; p <= niceMax + 0.0001; p += 0.05) yTicks.push(Math.round(p * 100) / 100);
  for (const t of yTicks) {
    const y = yOf(t);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('class', 'grid-line');
    line.setAttribute('x1', M.left); line.setAttribute('x2', W - M.right);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    svg.appendChild(line);
    const lbl = document.createElementNS(svgNS, 'text');
    lbl.setAttribute('class', 'tick-label');
    lbl.setAttribute('x', M.left - 8); lbl.setAttribute('y', y + 3);
    lbl.setAttribute('text-anchor', 'end');
    lbl.textContent = (t * 100).toFixed(0) + '%';
    svg.appendChild(lbl);
  }
  for (let n = 1; n <= maxFunds; n++) {
    const x = xOf(n);
    const lbl = document.createElementNS(svgNS, 'text');
    lbl.setAttribute('class', 'tick-label');
    lbl.setAttribute('x', x); lbl.setAttribute('y', H - M.bottom + 16);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.textContent = n;
    svg.appendChild(lbl);
  }

  // Axis labels
  const xlbl = document.createElementNS(svgNS, 'text');
  xlbl.setAttribute('class', 'axis-label');
  xlbl.setAttribute('x', M.left + PW / 2); xlbl.setAttribute('y', H - 10);
  xlbl.setAttribute('text-anchor', 'middle');
  xlbl.textContent = '# of funds holding (consensus →)';
  svg.appendChild(xlbl);

  const ylbl = document.createElementNS(svgNS, 'text');
  ylbl.setAttribute('class', 'axis-label');
  ylbl.setAttribute('x', -(M.top + PH / 2)); ylbl.setAttribute('y', 16);
  ylbl.setAttribute('text-anchor', 'middle');
  ylbl.setAttribute('transform', 'rotate(-90)');
  ylbl.textContent = 'Max % allocation (conviction ↑)';
  svg.appendChild(ylbl);

  // Quadrant dividers
  const hLine = document.createElementNS(svgNS, 'line');
  hLine.setAttribute('class', 'quadrant-line');
  hLine.setAttribute('x1', M.left); hLine.setAttribute('x2', W - M.right);
  hLine.setAttribute('y1', convictionLineY); hLine.setAttribute('y2', convictionLineY);
  svg.appendChild(hLine);
  const vLine = document.createElementNS(svgNS, 'line');
  vLine.setAttribute('class', 'quadrant-line');
  vLine.setAttribute('x1', consensusLineX); vLine.setAttribute('x2', consensusLineX);
  vLine.setAttribute('y1', M.top); vLine.setAttribute('y2', H - M.bottom);
  svg.appendChild(vLine);

  // Quadrant labels
  const quadrantLabels = [
    { x: M.left + 12, y: M.top + 14, text: 'LONELY CONVICTION', anchor: 'start' },
    { x: W - M.right - 12, y: M.top + 14, text: 'CROWDED MEGA-BETS', anchor: 'end' },
    { x: M.left + 12, y: H - M.bottom - 10, text: 'TAIL POSITIONS', anchor: 'start' },
    { x: W - M.right - 12, y: H - M.bottom - 10, text: 'CONSENSUS SMALL BETS', anchor: 'end' },
  ];
  for (const q of quadrantLabels) {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('class', 'quadrant-label');
    t.setAttribute('x', q.x); t.setAttribute('y', q.y);
    t.setAttribute('text-anchor', q.anchor);
    t.textContent = q.text;
    svg.appendChild(t);
  }

  // Sort dots by total $ descending so big dots draw under little ones,
  // keeping small/lonely conviction dots visible
  const sorted = [...data].sort((a, b) => b.totalUsd - a.totalUsd);

  // Jitter X so dots at the same integer don't all overlap
  const xJitter = (ticker, n) => {
    let h = 0; for (let i = 0; i < ticker.length; i++) h = (h * 31 + ticker.charCodeAt(i)) | 0;
    return xOf(n) + ((h % 100) / 100 - 0.5) * 28;
  };

  // Tooltip
  const tip = document.createElement('div');
  tip.className = 'conviction-tooltip';
  container.appendChild(tip);

  // Dots
  for (const d of sorted) {
    const cx = xJitter(d.ticker, d.numFunds);
    const cy = yOf(d.maxPct);
    const r = rOf(d.totalUsd);
    const color = catColor(d.category);

    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('class', 'dot');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', color); c.setAttribute('fill-opacity', '0.7');
    c.setAttribute('stroke', color); c.setAttribute('stroke-opacity', '0.9'); c.setAttribute('stroke-width', '1');

    // Hover
    c.addEventListener('mouseenter', (ev) => {
      tip.style.display = 'block';
      tip.innerHTML = `
        <div class="t">${d.ticker}</div>
        <div style="color: var(--text-dim); font-size: 10px; margin-bottom: 4px">${escapeHtml(d.issuer)}</div>
        <div class="row"><span>Category</span><span class="v">${d.category}</span></div>
        <div class="row"><span># funds holding</span><span class="v">${d.numFunds}</span></div>
        <div class="row"><span>Max allocation</span><span class="v">${fmtPct(d.maxPct)} (${d.maxFund})</span></div>
        <div class="row"><span>Median allocation</span><span class="v">${fmtPct(d.medianPct)}</span></div>
        <div class="row"><span>Total across funds</span><span class="v">${fmtDollarsM(d.totalUsd, 0)}</span></div>`;
    });
    c.addEventListener('mousemove', (ev) => {
      const rect = container.getBoundingClientRect();
      const x = ev.clientX - rect.left + 14;
      const y = ev.clientY - rect.top + 14;
      tip.style.left = Math.min(x, rect.width - 230) + 'px';
      tip.style.top = Math.min(y, rect.height - 160) + 'px';
    });
    c.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    c.addEventListener('click', () => openTickerDrawer(d.ticker));
    svg.appendChild(c);

    // Label only big dots so the chart stays readable
    if (r >= 10 || d.maxPct >= 0.10) {
      const lbl = document.createElementNS(svgNS, 'text');
      lbl.setAttribute('class', 'dot-label');
      lbl.setAttribute('x', cx); lbl.setAttribute('y', cy + 3);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.textContent = d.ticker;
      svg.appendChild(lbl);
    }
  }

  container.appendChild(svg);
}

// ============================================================================
// Ticker drawer
// ============================================================================
function openTickerDrawer(ticker) {
  const idx = buildTickerIndex();
  const holders = idx.get(ticker);
  if (!holders) return;
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  document.getElementById('drawerTitle').textContent = ticker;
  document.getElementById('drawerSub').textContent = holders[0].holding.issuer + ' · ' + holders[0].holding.category;

  const cat = holders[0].holding.category;
  const totalAcross = holders.reduce((s, h) => s + h.holding.total, 0);
  const numFunds = holders.length;
  const med = median(holders.map(h => h.holding.pct));

  let html = `
    <div class="stat-row">
      <div class="stat"><div class="label"># Funds holding</div><div class="value">${numFunds}</div></div>
      <div class="stat"><div class="label">Median % of 13F</div><div class="value small">${fmtPct(med)}</div></div>
      <div class="stat"><div class="label">Total across funds</div><div class="value small">${fmtDollarsM(totalAcross, 0)}</div></div>
    </div>
    <div style="margin: 8px 0 16px"><span class="cat-chip active"><span class="swatch" style="background:${catColor(cat)}"></span>${cat}</span></div>
    <h3>Holders</h3>
    <table>
      <thead><tr>
        <th>Fund</th>
        <th class="num">Equity</th>
        <th class="num">Calls</th>
        <th class="num">Puts</th>
        <th class="num">% of 13F</th>
      </tr></thead>
      <tbody>
      ${holders.sort((a, b) => b.holding.pct - a.holding.pct).map(h => `
        <tr data-fund="${escapeAttr(h.fund.shortLabel)}">
          <td style="cursor:pointer">${h.fund.shortLabel}${h.fund.isReference ? '<span class="badge sa">REF</span>' : ''}</td>
          <td class="num">${fmtDollarsM(h.holding.equity)}</td>
          <td class="num" style="${h.holding.calls>0?'color:var(--calls)':'color:var(--text-faint)'}">${fmtDollarsM(h.holding.calls)}</td>
          <td class="num" style="${h.holding.puts>0?'color:var(--puts)':'color:var(--text-faint)'}">${fmtDollarsM(h.holding.puts)}</td>
          <td class="num"><strong>${fmtPct(h.holding.pct)}</strong></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  document.getElementById('drawerBody').innerHTML = html;

  document.getElementById('drawerBody').querySelectorAll('tr[data-fund]').forEach(tr =>
    tr.addEventListener('click', () => { closeDrawer(); navigateToFund(tr.dataset.fund); }));

  drawer.classList.add('show');
  drawer.setAttribute('aria-hidden', 'false');
  overlay.classList.add('show');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerOverlay').classList.remove('show');
}

// ============================================================================
// EDGAR update
// ============================================================================
async function runEdgarUpdate() {
  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Fetching from EDGAR…';
  try {
    const ciks = STATE.data.funds.filter(f => f.cik).map(f => f.cik);
    // full=1 makes the server return per-fund holdings (not just a status summary)
    const r = await fetch('/api/edgar?full=1&ciks=' + ciks.join(','));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const result = await r.json();
    STATE.edgarResults = result;

    // Merge the freshly-pulled fund objects into STATE.data so the
    // dashboard reflects the latest filings without a page reload.
    let updated = 0;
    if (Array.isArray(result.funds_full)) {
      for (const fresh of result.funds_full) {
        const i = STATE.data.funds.findIndex(f => f.cik === fresh.cik);
        if (i >= 0) {
          // Preserve thesis/rank text from baked data; everything else from EDGAR
          const preserved = {
            thesis: STATE.data.funds[i].thesis,
            rank: STATE.data.funds[i].rank,
          };
          STATE.data.funds[i] = { ...STATE.data.funds[i], ...fresh, ...preserved };
        } else {
          STATE.data.funds.push(fresh);
        }
        updated++;
      }
    }

    // Invalidate caches that depend on holdings
    TICKER_INDEX = null;
    renderSearchIndex();
    STATE.edgarResults.appliedCount = updated;
    location.hash = '#/dashboard';
    render();
  } catch (e) {
    STATE.edgarResults = { error: e.message };
    render();
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function renderEdgarStatus() {
  const card = document.createElement('div');
  card.className = 'edgar-status';
  const r = STATE.edgarResults;
  if (r.error) {
    card.innerHTML = `<div class="err"><strong>EDGAR fetch failed:</strong> ${escapeHtml(r.error)}</div>`;
    return card;
  }
  const applied = r.appliedCount ? `· <span class="ok">${r.appliedCount} fund${r.appliedCount === 1 ? '' : 's'} updated in this session</span>` : '';
  let html = `<div style="margin-bottom: 8px"><strong>EDGAR results</strong> <span style="color:var(--text-faint)">${r.fetchedAt || ''}</span> ${applied} <button class="btn" style="float:right; padding: 2px 8px; font-size: 10px" id="dismissEdgar">Dismiss</button></div>`;
  for (const f of (r.funds || [])) {
    const newBadge = f.isNew ? '<span class="badge new">NEW</span>' : '';
    const status = f.error
      ? `<span class="err">${escapeHtml(f.error)}</span>`
      : `<span class="ok">${f.numIssuers || 0} issuers · ${f.periodOfReport || '—'}</span>`;
    html += `<div class="row"><div>${f.fundName || f.cik} ${newBadge}</div><div>${status}</div></div>`;
  }
  card.innerHTML = html;
  setTimeout(() => {
    const btn = card.querySelector('#dismissEdgar');
    if (btn) btn.onclick = () => { STATE.edgarResults = null; render(); };
  }, 0);
  return card;
}

// ============================================================================
// Search
// ============================================================================
let SEARCH_TICKERS = [], SEARCH_FUNDS = [];
function renderSearchIndex() {
  const idx = buildTickerIndex();
  SEARCH_TICKERS = [];
  for (const [ticker, list] of idx.entries()) {
    SEARCH_TICKERS.push({ ticker, issuer: list[0].holding.issuer });
  }
  SEARCH_FUNDS = STATE.data.funds.map(f => ({ name: f.shortLabel, full: f.name }));
}

function setupEvents() {
  // Min-position-pct selector — global filter
  const minSel = document.getElementById('minPctSelect');
  if (minSel) {
    minSel.value = String(STATE.minPositionPct);
    minSel.addEventListener('change', () => {
      STATE.minPositionPct = parseFloat(minSel.value);
      persistCustomizations();
      TICKER_INDEX = null;
      render();
    });
  }

  const inp = document.getElementById('searchInput');
  const out = document.getElementById('searchResults');
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { out.classList.remove('show'); return; }
    const tickers = SEARCH_TICKERS.filter(t =>
      t.ticker.toLowerCase().startsWith(q) || t.issuer.toLowerCase().includes(q)).slice(0, 8);
    const funds = SEARCH_FUNDS.filter(f =>
      f.name.toLowerCase().includes(q) || f.full.toLowerCase().includes(q)).slice(0, 6);
    let html = '';
    if (tickers.length) {
      html += '<div class="group">Tickers</div>';
      for (const t of tickers) html += `<div class="item" data-action="ticker" data-arg="${escapeAttr(t.ticker)}"><span class="t">${t.ticker}</span><span class="name">${escapeHtml(t.issuer)}</span></div>`;
    }
    if (funds.length) {
      html += '<div class="group">Funds</div>';
      for (const f of funds) html += `<div class="item" data-action="fund" data-arg="${escapeAttr(f.name)}"><span class="t">${escapeHtml(f.name)}</span><span class="name">${escapeHtml(f.full)}</span></div>`;
    }
    if (!html) html = '<div class="item" style="color:var(--text-faint)">No matches</div>';
    out.innerHTML = html;
    out.classList.add('show');
    out.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', () => {
      const a = el.dataset.action, arg = el.dataset.arg;
      out.classList.remove('show');
      inp.value = '';
      if (a === 'ticker') openTickerDrawer(arg);
      else if (a === 'fund') navigateToFund(arg);
    }));
  });
  inp.addEventListener('blur', () => setTimeout(() => out.classList.remove('show'), 150));

  // Nav clicks
  document.querySelectorAll('nav.tabs a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    location.hash = a.dataset.route;
  }));

  document.getElementById('drawerClose').onclick = closeDrawer;
  document.getElementById('drawerOverlay').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  document.getElementById('updateBtn').onclick = runEdgarUpdate;
}

function navigateToFund(shortLabel) {
  location.hash = '#/fund/' + encodeURIComponent(shortLabel);
}

// ============================================================================
// Caveats
// ============================================================================
function renderCaveats() {
  const ul = document.getElementById('caveats');
  for (const c of (STATE.data.caveats || [])) {
    const li = document.createElement('li');
    li.textContent = c;
    ul.appendChild(li);
  }
}

// ============================================================================
// Utils
// ============================================================================
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

</script>
