<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>13F · AI Hedge Fund Tracker</title>
<style>
:root {
  --bg: #0c0f14;
  --bg-elev: #131720;
  --bg-elev2: #1a1f2b;
  --bg-hover: #20263a;
  --border: #232a3a;
  --border-strong: #2f3850;
  --text: #e6e8ee;
  --text-dim: #8a93a6;
  --text-faint: #5a637a;
  --accent: #66b3ff;
  --accent-soft: rgba(102,179,255,0.12);
  --calls: #4ade80;  /* green */
  --puts: #f87171;   /* red */
  --sa: #fbbf24;     /* yellow — Situational Awareness reference */
  --row-hover: #1c2233;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 13px; line-height: 1.45; }
body { min-height: 100vh; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font-family: inherit; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- Layout ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  font-weight: 700;
  letter-spacing: 0.5px;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.brand .sub { color: var(--text-dim); font-weight: 400; }

nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
nav.tabs a {
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
}
nav.tabs a:hover { background: var(--bg-hover); color: var(--text); }
nav.tabs a.active { color: var(--text); background: var(--bg-elev2); }

.search {
  margin-left: auto;
  position: relative;
}
.search input {
  width: 260px;
  background: var(--bg-elev2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
.search input:focus { border-color: var(--accent); }
.search-results {
  position: absolute;
  top: 32px;
  right: 0;
  width: 320px;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 6px 0;
  max-height: 360px;
  overflow-y: auto;
  display: none;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.search-results.show { display: block; }
.search-results .group { font-size: 10px; text-transform: uppercase; color: var(--text-faint); padding: 6px 12px 2px; letter-spacing: 0.5px; }
.search-results .item { padding: 5px 12px; cursor: pointer; font-size: 12px; display: flex; gap: 8px; align-items: center; }
.search-results .item:hover { background: var(--bg-hover); }
.search-results .item .t { font-family: var(--font-mono); color: var(--accent); width: 70px; }
.search-results .item .name { color: var(--text-dim); font-size: 11px; }

.btn {
  background: var(--bg-elev2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.btn:hover { background: var(--bg-hover); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #0c0f14; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }

.main {
  padding: 18px 24px 80px;
  max-width: 1500px;
  margin: 0 auto;
}

h1, h2, h3, h4 { font-weight: 600; margin: 0; color: var(--text); }
h1 { font-size: 16px; }
h2 { font-size: 14px; margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0 0 8px; }

/* ---------- Cards ---------- */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.card .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.card .card-header .right { display: flex; gap: 8px; align-items: center; color: var(--text-faint); font-size: 11px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }

/* ---------- Tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  text-align: left;
  font-weight: 500;
  color: var(--text-faint);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.5px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  position: sticky;
  top: 0;
}
thead th.num { text-align: right; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }
thead th .sort-ind {
  display: inline-block;
  margin-left: 4px;
  color: var(--accent);
  font-size: 10px;
  width: 8px;
}
thead th.sort-active { color: var(--text); }
tbody td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--row-hover); cursor: pointer; }
tbody tr.fund-row { cursor: default; }
tbody td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

.ticker {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
}
.ticker:hover { text-decoration: underline; }

/* ---------- Category chips ---------- */
.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev2);
  color: var(--text-dim);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.cat-chip .swatch { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.cat-chip.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

.category-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }

/* ---------- Badges ---------- */
.badge {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  font-family: var(--font-mono);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  font-weight: 600;
}
.badge.calls { background: rgba(74,222,128,0.18); color: var(--calls); }
.badge.puts  { background: rgba(248,113,113,0.18); color: var(--puts); }
.badge.new   { background: rgba(102,179,255,0.18); color: var(--accent); }
.badge.sa    { background: rgba(251,191,36,0.18); color: var(--sa); }
.badge.high  { background: rgba(248,113,113,0.22); color: var(--puts); }

/* ---------- Stacked bars ---------- */
.stacked-bar {
  display: flex;
  height: 14px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--bg-elev2);
  min-width: 120px;
}
.stacked-bar .seg { height: 100%; }
.stacked-bar .seg.eq    { background: #2563eb; }
.stacked-bar .seg.calls { background: var(--calls); }
.stacked-bar .seg.puts  { background: var(--puts); }

.bar-thin {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-elev2);
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}
.bar-thin .fill { height: 100%; background: var(--accent); }

/* ---------- Stats row ---------- */
.stat-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
.stat { min-width: 110px; }
.stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 2px; }
.stat .value { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--text); }
.stat .value.small { font-size: 14px; }
.stat .sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

/* ---------- Drawer ---------- */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 200;
}
.drawer-overlay.show { display: block; }
.drawer {
  position: fixed;
  top: 0; right: -560px;
  width: 540px; max-width: 90vw;
  height: 100vh;
  background: var(--bg-elev);
  border-left: 1px solid var(--border-strong);
  transition: right 0.18s ease;
  z-index: 201;
  display: flex;
  flex-direction: column;
}
.drawer.show { right: 0; }
.drawer-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
.drawer-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.drawer-close:hover { color: var(--text); }

/* ---------- Fund list ---------- */
.fund-card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.fund-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
}
.fund-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.fund-card.sa { border-left: 3px solid var(--sa); }
.fund-card h4 { font-size: 13px; margin-bottom: 2px; }
.fund-card .manager { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.fund-card .meta { display: flex; gap: 14px; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.fund-card .meta .v { color: var(--text); font-family: var(--font-mono); }

/* ---------- Section gaps ---------- */
.section { margin-bottom: 22px; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
.section-title .sub { font-size: 11px; color: var(--text-faint); text-transform: none; letter-spacing: 0; }

/* ---------- Compare ---------- */
.fund-picker {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.fund-picker label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.fund-picker label:hover { border-color: var(--accent); }
.fund-picker input[type=checkbox] { accent-color: var(--accent); }
.fund-picker label.checked { background: var(--accent-soft); border-color: var(--accent); }

.compare-grid { display: grid; gap: 16px; }
.compare-bars { display: grid; gap: 10px; }
.compare-bar-row { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 12px; }
.compare-bar-row .label { font-size: 12px; color: var(--text-dim); }
.compare-bar {
  height: 20px;
  background: var(--bg-elev2);
  border-radius: 3px;
  overflow: hidden;
  display: flex;
}
.compare-bar .seg { height: 100%; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--text-dim); }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }

/* ---------- View toggle ---------- */
.toggle-group { display: inline-flex; background: var(--bg-elev2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.toggle-group button {
  background: none;
  border: none;
  color: var(--text-dim);
  padding: 4px 12px;
  font-size: 11px;
  cursor: pointer;
}
.toggle-group button.active { background: var(--accent-soft); color: var(--text); }
.toggle-group button:hover:not(.active) { color: var(--text); }

/* ---------- Conviction map ---------- */
.conviction-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
@media (max-width: 1200px) { .conviction-wrap { grid-template-columns: 1fr; } }
.conviction-chart {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  position: relative;
}
.conviction-chart svg { display: block; width: 100%; height: auto; }
.conviction-chart .axis-label { fill: var(--text-faint); font-size: 10px; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.5px; }
.conviction-chart .tick-label { fill: var(--text-dim); font-size: 10px; font-family: var(--font-mono); }
.conviction-chart .grid-line { stroke: var(--border); stroke-dasharray: 2 3; stroke-width: 1; }
.conviction-chart .quadrant-line { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.conviction-chart .quadrant-label { fill: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; font-family: var(--font-sans); }
.conviction-chart .dot { cursor: pointer; transition: stroke-width 0.1s, filter 0.1s; }
.conviction-chart .dot:hover { stroke: var(--text); stroke-width: 1.5; filter: brightness(1.3); }
.conviction-chart .dot-label { fill: var(--text); font-size: 9px; font-family: var(--font-mono); pointer-events: none; }
.conviction-tooltip {
  position: absolute;
  background: var(--bg-elev2);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 8px 10px;
  font-size: 11px;
  pointer-events: none;
  display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 10;
  min-width: 200px;
}
.conviction-tooltip .t { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 13px; }
.conviction-tooltip .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 2px; color: var(--text-dim); }
.conviction-tooltip .row .v { color: var(--text); font-family: var(--font-mono); }

.conviction-side { display: flex; flex-direction: column; gap: 16px; }
.conviction-list { padding: 0; margin: 0; list-style: none; }
.conviction-list li {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  cursor: pointer;
  align-items: center;
}
.conviction-list li:hover { background: var(--row-hover); }
.conviction-list li:last-child { border-bottom: none; }
.conviction-list .lc-fund { color: var(--text-dim); font-size: 11px; }
.conviction-list .lc-pct { font-family: var(--font-mono); color: var(--text); text-align: right; font-weight: 600; }
.conviction-list .lc-meta { font-size: 10px; color: var(--text-faint); }

/* ---------- Footer ---------- */
.footer { padding: 16px 24px; max-width: 1500px; margin: 0 auto; font-size: 10.5px; color: var(--text-faint); border-top: 1px solid var(--border); }
.footer ul { padding-left: 18px; margin: 6px 0 0; }
.footer li { margin-bottom: 3px; }

/* ---------- Empty state ---------- */
.empty {
  padding: 32px 24px;
  text-align: center;
  color: var(--text-faint);
  font-size: 12px;
}

/* ---------- Edgar status ---------- */
.edgar-status {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 12px;
}
.edgar-status .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.edgar-status .row:last-child { border-bottom: none; }
.edgar-status .ok { color: var(--calls); }
.edgar-status .err { color: var(--puts); }

</style>
</head>

<div class="topbar">
  <div class="brand"><span class="dot"></span> 13F · AI Hedge Fund Tracker <span class="sub" id="asOfLabel"></span></div>

</div>

<div class="main" id="main"></div>

<div class="footer">
  <strong>Caveats:</strong>
  <ul id="caveats"></ul>
</div>

<script>
'use strict';

// ============================================================================
// State
// ============================================================================
const STATE = {
  data: null,
  route: parseRoute(location.hash),
  filterCategory: null,
  compareSelection: new Set(),
  edgarResults: null,
  fundViewMode: 'all', // all | top10 | byCategory
  // Per-table sort state for the compare view: { common: {col, dir}, divergent: {...} }
  compareSort: { common: null, divergent: null },
  // Current prices: { TICKER: { price, asOf } } — refreshed via /api/prices
  currentPrices: {},
  pricesFetching: false,
  pricesError: null,
};

function parseRoute(hash) {
  hash = hash || '#/dashboard';
  const parts = hash.replace(/^#\//, '').split('/');
  return { name: parts[0] || 'dashboard', arg: parts[1] || null };
}

window.addEventListener('hashchange', () => {
  STATE.route = parseRoute(location.hash);
  render();
});

// ============================================================================
// Boot
// ============================================================================
async function boot() {
  // 1) Prefer inline-baked data (works via file:// and Vercel alike).
  const baked = document.getElementById('bakedData');
  if (baked && baked.textContent && baked.textContent.trim() && !baked.textContent.includes('__BAKED_DATA__')) {
    try { STATE.data = JSON.parse(baked.textContent); } catch (e) {}
  }
  // 2) Otherwise fetch data.json (works via any http(s):// host).
  if (!STATE.data) {
    try {
      const r = await fetch('data.json?v=' + Date.now());
      STATE.data = await r.json();
    } catch (e) {
      document.getElementById('main').innerHTML =
        '<div class="empty">Could not load data. Run <code>python3 scripts/build_data.py</code> to regenerate, then refresh.</div>';
      return;
    }
  }

  document.getElementById('asOfLabel').textContent = '· ' + STATE.data.asOf;
  renderCaveats();
  renderSearchIndex();
  setupEvents();
  render();
}

document.addEventListener('DOMContentLoaded', boot);

// ============================================================================
// Helpers
// ============================================================================
const COLORS = {}; // populated from data on boot
function catColor(c) {
  if (Object.keys(COLORS).length === 0 && STATE.data) Object.assign(COLORS, STATE.data.categoryColors);
  return COLORS[c] || '#5a5a5a';
}

function fmtPct(p, decimals = 1) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  return (p * 100).toFixed(decimals) + '%';
}
function fmtDollarsM(m, decimals = 1) {
  if (m === null || m === undefined || isNaN(m)) return '—';
  if (m >= 1000) return '$' + (m / 1000).toFixed(decimals) + 'B';
  if (m === 0) return '$0';
  return '$' + m.toFixed(decimals) + 'M';
}
function fmtDollarsB(b, decimals = 2) {
  if (b === null || b === undefined || isNaN(b)) return '—';
  return '$' + b.toFixed(decimals) + 'B';
}
function fundsWithHoldings() { return STATE.data.funds.filter(f => f.hasHoldings); }
function findFund(nameOrShort) {
  return STATE.data.funds.find(f => f.name === nameOrShort || f.shortLabel === nameOrShort);
}
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Build ticker index: { ticker -> [{fund, holding}] }
let TICKER_INDEX = null;
function buildTickerIndex() {
  if (TICKER_INDEX) return TICKER_INDEX;
  TICKER_INDEX = new Map();
  for (const f of fundsWithHoldings()) {
    for (const h of f.holdings) {
      if (!TICKER_INDEX.has(h.ticker)) TICKER_INDEX.set(h.ticker, []);
      TICKER_INDEX.get(h.ticker).push({ fund: f, holding: h });
    }
  }
  return TICKER_INDEX;
}

// ============================================================================
// Router / render
// ============================================================================
function render() {
  // Highlight active tab
  document.querySelectorAll('nav.tabs a').forEach(a => {
    const r = a.dataset.route.replace(/^#\//, '').split('/')[0];
    a.classList.toggle('active', r === STATE.route.name);
  });
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (STATE.route.name === 'dashboard') renderDashboard(main);
  else if (STATE.route.name === 'funds') renderFundList(main);
  else if (STATE.route.name === 'fund') renderFundView(main, decodeURIComponent(STATE.route.arg || ''));
  else if (STATE.route.name === 'compare') renderCompare(main);
  else if (STATE.route.name === 'conviction') renderConviction(main);
  else renderDashboard(main);
}

// ============================================================================
// Dashboard
// ============================================================================
function renderDashboard(root) {
  const data = STATE.data;
  const funds = fundsWithHoldings();

  // Category filter
  const catFilter = document.createElement('div');
  catFilter.className = 'category-filter';
  const allChip = document.createElement('span');
  allChip.className = 'cat-chip' + (STATE.filterCategory === null ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { STATE.filterCategory = null; render(); };
  catFilter.appendChild(allChip);
  for (const c of data.categories) {
    const chip = document.createElement('span');
    chip.className = 'cat-chip' + (STATE.filterCategory === c ? ' active' : '');
    chip.innerHTML = `<span class="swatch" style="background:${catColor(c)}"></span>${c}`;
    chip.onclick = () => { STATE.filterCategory = (STATE.filterCategory === c) ? null : c; render(); };
    catFilter.appendChild(chip);
  }
  root.appendChild(catFilter);

  // EDGAR status panel (if results exist)
  if (STATE.edgarResults) {
    root.appendChild(renderEdgarStatus());
  }

  // Top names table
  root.appendChild(renderTopNamesCard());

  // Two-column: high-conviction + outsize bets
  const cols = document.createElement('div');
  cols.className = 'grid-2';
  cols.appendChild(renderHighConvictionCard());
  cols.appendChild(renderOutsizeBetsCard());
  root.appendChild(cols);

  // Fund snapshot grid
  root.appendChild(renderFundSnapshot());
}

// "Top names across all funds"
function renderTopNamesCard() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>Top names across all funds</h2>
    <div class="right">Ranked by (# of funds holding) × (median % allocation when held)</div></div>`;

  const idx = buildTickerIndex();
  const rows = [];
  for (const [ticker, list] of idx.entries()) {
    const cat = list[0].holding.category;
    if (STATE.filterCategory && cat !== STATE.filterCategory) continue;
    const pcts = list.map(x => x.holding.pct);
    const med = median(pcts);
    const maxObj = list.reduce((a, b) => b.holding.pct > a.holding.pct ? b : a);
    rows.push({
      ticker,
      issuer: list[0].holding.issuer,
      category: cat,
      numFunds: list.length,
      medianPct: med,
      maxPct: maxObj.holding.pct,
      maxFund: maxObj.fund.shortLabel,
      score: list.length * med,
    });
  }
  rows.sort((a, b) => b.score - a.score);
  const top = rows.slice(0, 30);

  const tableHtml = `
    <table>
      <thead><tr>
        <th>Ticker</th>

// "High-conviction positions"
function renderHighConvictionCard() {

// "Outsize bets"
function renderOutsizeBetsCard() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>Outsize bets</h2>
    <div class="right">Allocations > 2× the median across ≥2-fund holders</div></div>`;

  const idx = buildTickerIndex();
  const flags = [];
  for (const [ticker, list] of idx.entries()) {
    if (list.length < 2) continue;
    const cat = list[0].holding.category;
    if (STATE.filterCategory && cat !== STATE.filterCategory) continue;
    const pcts = list.map(x => x.holding.pct);
    const med = median(pcts);
    if (med <= 0) continue;
    for (const item of list) {
      const ratio = item.holding.pct / med;
      if (ratio > 2.0) {
        flags.push({
          ticker, category: cat,
          fund: item.fund.shortLabel,
          pct: item.holding.pct,
          medianPct: med,
          ratio,
        });
      }
    }
  }
  flags.sort((a, b) => b.ratio - a.ratio);

  let html = '';
  if (!flags.length) {
    html = '<div class="empty">No outsize bets match the current filter.</div>';
  } else {
    html = `<table>
      <thead><tr><th>Ticker</th><th>Fund</th><th class="num">Their %</th><th class="num">Median %</th><th class="num">Ratio</th></tr></thead>
      <tbody>
      ${flags.slice(0, 25).map(r => `
        <tr data-ticker="${r.ticker}">
          <td><span class="ticker">${r.ticker}</span></td>
          <td data-fund="${escapeAttr(r.fund)}" style="cursor:pointer">${r.fund}</td>
          <td class="num">${fmtPct(r.pct)}</td>
          <td class="num">${fmtPct(r.medianPct)}</td>
          <td class="num" style="color:${r.ratio > 4 ? 'var(--puts)' : 'var(--sa)'}">${r.ratio.toFixed(1)}×</td>
        </tr>`).join('')}
      </tbody></table>`;
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  card.appendChild(wrap);

  wrap.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', e => {
    const fundCell = e.target.closest('td[data-fund]');
    if (fundCell) { e.stopPropagation(); navigateToFund(fundCell.dataset.fund); return; }
    openTickerDrawer(tr.dataset.ticker);
  }));
  return card;
}

// ---------------------------------------------------------------------------
// Price helpers
// ---------------------------------------------------------------------------
async function loadCurrentPricesForFund(fund) {
  const tickers = [...new Set(fund.holdings.map(h => h.ticker).filter(t => /^[A-Z][A-Z0-9.\-]{0,6}$/.test(t)))];
  if (!tickers.length) return;
  STATE.pricesFetching = true;
  STATE.pricesError = null;
  try {
    const r = await fetch('/api/prices?tickers=' + encodeURIComponent(tickers.join(',')));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    Object.assign(STATE.currentPrices, data.prices || {});
  } catch (e) {
    STATE.pricesError = e.message;
  } finally {
    STATE.pricesFetching = false;
  }
}

function pctSinceReport(fund, h) {
  const period = fund.periodOfReport || STATE.data.asOf;
  const since = STATE.data.historicalPrices?.[period]?.[h.ticker]?.price;
  const now = STATE.currentPrices?.[h.ticker]?.price;
  if (!since || !now) return null;
  return (now - since) / since;
}

// Fund-level aggregate — equity-weighted average price change.
// Options notional is excluded because option P&L isn't linear in spot price.
function fundEquityGrowth(fund) {
  let wSum = 0, weighted = 0;
  for (const h of fund.holdings) {
    const pct = pctSinceReport(fund, h);
    if (pct == null || !h.equity) continue;
    wSum += h.equity;
    weighted += h.equity * pct;
  }
  return wSum > 0 ? { pct: weighted / wSum, coverage: wSum } : null;
}

function updateGrowthStat(fund) {
  const stat = document.getElementById('growthStat');
  if (!stat) return;
  const period = fund.periodOfReport || STATE.data.asOf;
  const coverageEquity = fund.holdings.reduce((s, h) => s + (h.equity || 0), 0);
  const growth = fundEquityGrowth(fund);
  if (STATE.pricesError) {
    stat.querySelector('.value').textContent = '—';
    stat.querySelector('.sub').textContent = 'price fetch failed';
    stat.querySelector('.sub').style.color = 'var(--puts)';
    return;
  }
  if (!growth) {
    stat.querySelector('.value').textContent = '—';
    stat.querySelector('.sub').textContent = 'no baked since-prices · run scripts/refresh_prices.mjs';
    return;
  }
  const v = stat.querySelector('.value');
  const sign = growth.pct >= 0 ? '+' : '';
  v.textContent = `${sign}${(growth.pct * 100).toFixed(1)}%`;
  v.style.color = growth.pct >= 0 ? 'var(--calls)' : 'var(--puts)';
  const cov = coverageEquity > 0 ? growth.coverage / coverageEquity : 0;
  stat.querySelector('.sub').textContent = `equity-weighted · covers ${(cov * 100).toFixed(0)}% of $${fund.holdings.reduce((s,h)=>s+(h.equity||0),0).toFixed(0)}M`;
  stat.querySelector('.sub').style.color = 'var(--text-dim)';
}

function drawFundTable(container, fund) {
  let holdings = [...fund.holdings].sort((a, b) => b.pct - a.pct);
  if (STATE.fundViewMode === 'top10') holdings = holdings.slice(0, 10);

  if (STATE.fundViewMode === 'byCategory') {
    // Group by category
    const groups = {};
    for (const h of holdings) (groups[h.category] = groups[h.category] || []).push(h);
    let html = '';
    for (const [cat, items] of Object.entries(groups).sort((a, b) => {
      const sa = a[1].reduce((s, h) => s + h.pct, 0);
      const sb = b[1].reduce((s, h) => s + h.pct, 0);
      return sb - sa;
    })) {
      const total = items.reduce((s, h) => s + h.pct, 0);
      html += `<div class="section">
        <div class="section-title">
          <span class="cat-chip"><span class="swatch" style="background:${catColor(cat)}"></span>${cat}</span>
          <span class="sub">${items.length} positions · ${fmtPct(total)} of 13F</span>
        </div>
        ${holdingsTableHtml(items, fund)}
      </div>`;
    }
    container.innerHTML = html;
  } else {
    container.innerHTML = holdingsTableHtml(holdings, fund);
  }

  container.querySelectorAll('tbody tr').forEach(tr =>
    tr.addEventListener('click', () => openTickerDrawer(tr.dataset.ticker)));
}

function holdingsTableHtml(rows, fund) {
  // Resolve fund (drawFundTable passes it; if not provided, find via shortLabel route)
  if (!fund) fund = findFund(STATE.route.arg);
  const period = fund?.periodOfReport || STATE.data.asOf;
  const renderGrowth = (h) => {
    const pct = pctSinceReport(fund, h);
    if (pct == null) {
      if (STATE.pricesFetching) return '<span style="color:var(--text-faint)">…</span>';
      return '<span style="color:var(--text-faint)" title="No baked since-price. Run scripts/refresh_prices.mjs">—</span>';
    }
    const sign = pct >= 0 ? '+' : '';
    const color = pct >= 0 ? 'var(--calls)' : 'var(--puts)';
    const since = STATE.data.historicalPrices?.[period]?.[h.ticker];
    const now = STATE.currentPrices?.[h.ticker];
    const tip = since && now
      ? `${since.asOf}: $${since.price.toFixed(2)} → ${now.asOf}: $${now.price.toFixed(2)}`
      : '';
    return `<span style="color:${color}" title="${escapeAttr(tip)}">${sign}${(pct * 100).toFixed(1)}%</span>`;
  };

  return `<table>
    <thead><tr>
      <th>#</th><th>Ticker</th><th>Issuer</th><th>Category</th>
      <th class="num">Equity</th><th class="num">Calls</th><th class="num">Puts</th>
      <th class="num">Total</th><th class="num">% of 13F</th>
      <th class="num" title="Underlying price change from ${period} to today">Δ since ${period.slice(5)}</th>
      <th style="width:80px">Allocation</th>
    </tr></thead>
    <tbody>
    ${rows.map((h, i) => `
      <tr data-ticker="${h.ticker}">
        <td style="color:var(--text-faint)">${i + 1}</td>
        <td><span class="ticker">${h.ticker}</span>${h.calls > 0 ? '<span class="badge calls">C</span>' : ''}${h.puts > 0 ? '<span class="badge puts">P</span>' : ''}</td>
        <td style="color:var(--text-dim)">${escapeHtml(h.issuer)}</td>
        <td><span class="cat-chip"><span class="swatch" style="background:${catColor(h.category)}"></span>${h.category}</span></td>
        <td class="num">${fmtDollarsM(h.equity)}</td>
        <td class="num" style="${h.calls>0?'color:var(--calls)':''}">${fmtDollarsM(h.calls)}</td>
        <td class="num" style="${h.puts>0?'color:var(--puts)':''}">${fmtDollarsM(h.puts)}</td>
        <td class="num">${fmtDollarsM(h.total)}</td>
        <td class="num">${fmtPct(h.pct)}</td>
        <td class="num">${renderGrowth(h)}</td>
        <td><div class="bar-thin" style="width:60px"><div class="fill" style="width:${Math.min(100, h.pct * 100 / 0.22 * 100).toFixed(0)}%; background:${catColor(h.category)}"></div></div></td>
      </tr>`).join('')}
    </tbody></table>`;
}

function renderCompare(root) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-header"><h2>Compare funds</h2>
    <div class="right">Select up to 4</div></div>`;

  const picker = document.createElement('div');
  picker.className = 'fund-picker';
  for (const f of fundsWithHoldings()) {
    const checked = STATE.compareSelection.has(f.shortLabel);
    const lbl = document.createElement('label');
    lbl.className = checked ? 'checked' : '';
    lbl.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}> <span>${f.shortLabel}</span> <span style="color:var(--text-faint); font-size: 10px; margin-left:auto">${fmtDollarsB(f.totalBn)}</span>`;
    lbl.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) {
        if (STATE.compareSelection.size >= 4) { e.target.checked = false; return; }
        STATE.compareSelection.add(f.shortLabel);
      } else STATE.compareSelection.delete(f.shortLabel);
      // Selection changed — fund column indices shift, so reset sort state.
      STATE.compareSort = { common: null, divergent: null };
      render();
    });
    picker.appendChild(lbl);
  }
  card.appendChild(picker);
  root.appendChild(card);

  if (STATE.compareSelection.size < 2) {
    const hint = document.createElement('div');
    hint.className = 'empty';
    hint.textContent = 'Pick 2-4 funds above to compare.';
    root.appendChild(hint);
    return;
  }

  const selected = [...STATE.compareSelection].map(s => findFund(s)).filter(Boolean);

  // Category allocation bars
  const allocCard = document.createElement('div');
  allocCard.className = 'card';
  allocCard.innerHTML = `<h2>Category allocation</h2>`;
  const cats = STATE.data.categories;
  const allocBars = document.createElement('div');
  allocBars.className = 'compare-bars';
  for (const f of selected) {
    const totals = {};
    let grand = 0;
    for (const h of f.holdings) {
      totals[h.category] = (totals[h.category] || 0) + h.pct;
      grand += h.pct;
    }
    const segs = cats.filter(c => totals[c] > 0).map(c => {
      const pct = totals[c] / (grand || 1);
      return `<div class="seg" style="width:${(pct*100).toFixed(1)}%; background:${catColor(c)}" title="${c}: ${fmtPct(pct,1)}"></div>`;
    }).join('');
    const row = document.createElement('div');
    row.className = 'compare-bar-row';
    row.innerHTML = `<div class="label">${f.shortLabel}<div style="font-size:10px; color:var(--text-faint)">${fmtDollarsB(f.totalBn)} · ${f.numIssuers} issuers</div></div>
      <div class="compare-bar">${segs}</div>`;
    allocBars.appendChild(row);
  }
  allocCard.appendChild(allocBars);
  // Legend
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.style.marginTop = '12px';
  for (const c of cats) legend.innerHTML += `<div><span class="swatch" style="background:${catColor(c)}"></span>${c}</div>`;
  allocCard.appendChild(legend);
  root.appendChild(allocCard);

  // Common & divergence
  const common = [], divergent = [];
  const tickerSets = selected.map(f => new Map(f.holdings.map(h => [h.ticker, h])));
  const allTickers = new Set();
  tickerSets.forEach(m => m.forEach((_, k) => allTickers.add(k)));
  for (const t of allTickers) {
    const presence = tickerSets.map(m => m.get(t));
    const heldBy = presence.filter(Boolean).length;
    if (heldBy === selected.length) common.push({ ticker: t, presence });
    else if (heldBy >= 2) divergent.push({ ticker: t, presence, heldBy });
  }
  common.sort((a, b) => {
    const sa = a.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    const sb = b.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    return sb - sa;
  });
  divergent.sort((a, b) => b.heldBy - a.heldBy || (() => {
    const sa = a.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    const sb = b.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
    return sb - sa;
  })());

  const commonCard = document.createElement('div');
  commonCard.className = 'card';
  commonCard.dataset.tableId = 'common';
  commonCard.innerHTML = `<div class="card-header"><h2>Common holdings</h2>
    <div class="right">${common.length} tickers held by all ${selected.length}</div></div>
    <div class="compare-table-wrap"></div>`;
  root.appendChild(commonCard);
  drawComparisonTable(commonCard.querySelector('.compare-table-wrap'), 'common', common, selected, false);

  const divCard = document.createElement('div');
  divCard.className = 'card';
  divCard.dataset.tableId = 'divergent';
  divCard.innerHTML = `<div class="card-header"><h2>Divergence — held by some, not all</h2>
    <div class="right">${divergent.length} tickers</div></div>
    <div class="compare-table-wrap"></div>`;
  root.appendChild(divCard);
  drawComparisonTable(divCard.querySelector('.compare-table-wrap'), 'divergent', divergent, selected, true);
}

// Default sort = "score" (sum of allocations across selected funds, desc)
function defaultCompareSort(showHeldBy) {
  return { col: 'score', dir: 'desc' };
}

function drawComparisonTable(container, tableId, rows, selected, showHeldBy) {
  if (!rows.length) { container.innerHTML = '<div class="empty">None.</div>'; return; }

  // Active sort state — fall back to default
  const sort = STATE.compareSort[tableId] || defaultCompareSort(showHeldBy);

  // Sort rows
  const cmp = (a, b) => {
    const dir = sort.dir === 'asc' ? 1 : -1;
    let av, bv;
    if (sort.col === 'ticker') { av = a.ticker; bv = b.ticker; return av.localeCompare(bv) * dir; }
    if (sort.col === 'category') {
      av = (a.presence.find(Boolean) || {}).category || 'Other';
      bv = (b.presence.find(Boolean) || {}).category || 'Other';
      return av.localeCompare(bv) * dir;
    }
    if (sort.col === 'heldBy') { return ((a.heldBy || 0) - (b.heldBy || 0)) * dir; }
    if (sort.col === 'score') {
      av = a.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
      bv = b.presence.reduce((s, p) => s + (p ? p.pct : 0), 0);
      return (av - bv) * dir;
    }
    // Per-fund column — col is the fund index "fund:0", "fund:1", ...
    if (sort.col.startsWith('fund:')) {
      const idx = parseInt(sort.col.split(':')[1], 10);
      // Treat missing positions as -1 so they sort to the bottom on desc
      av = a.presence[idx] ? a.presence[idx].pct : -1;
      bv = b.presence[idx] ? b.presence[idx].pct : -1;
      return (av - bv) * dir;
    }
    return 0;
  };
  const sorted = [...rows].sort(cmp);

  const arrow = (col) => sort.col === col
    ? `<span class="sort-ind">${sort.dir === 'asc' ? '▲' : '▼'}</span>`
    : '<span class="sort-ind"></span>';
  const thClass = (col) => 'sortable' + (sort.col === col ? ' sort-active' : '');

  const html = `<table>
    <thead><tr>
      <th class="${thClass('ticker')}" data-sort="ticker">Ticker${arrow('ticker')}</th>
      <th class="${thClass('category')}" data-sort="category">Category${arrow('category')}</th>
      ${selected.map((f, i) => `<th class="num ${thClass('fund:'+i)}" data-sort="fund:${i}">${f.shortLabel}${arrow('fund:'+i)}</th>`).join('')}
      ${showHeldBy ? `<th class="num ${thClass('heldBy')}" data-sort="heldBy"># holders${arrow('heldBy')}</th>` : ''}
    </tr></thead>
    <tbody>
    ${sorted.slice(0, 80).map(r => {
      const cat = (r.presence.find(Boolean) || {}).category || 'Other';
      return `<tr data-ticker="${r.ticker}">
        <td><span class="ticker">${r.ticker}</span></td>
        <td><span class="cat-chip"><span class="swatch" style="background:${catColor(cat)}"></span>${cat}</span></td>
        ${r.presence.map(p => `<td class="num">${p ? fmtPct(p.pct) : '<span style="color:var(--text-faint)">—</span>'}</td>`).join('')}
        ${showHeldBy ? `<td class="num">${r.heldBy}</td>` : ''}
      </tr>`;
    }).join('')}
    </tbody></table>`;
  container.innerHTML = html;

  // Wire header clicks: toggle asc <-> desc on same column, switch to desc on new column
  container.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      const current = STATE.compareSort[tableId];
      let next;
      if (current && current.col === col) {
        next = { col, dir: current.dir === 'asc' ? 'desc' : 'asc' };
      } else {
        // Numeric columns default to descending (biggest first), text columns to ascending
        const numericDefault = col.startsWith('fund:') || col === 'heldBy' || col === 'score';
        next = { col, dir: numericDefault ? 'desc' : 'asc' };
      }
      STATE.compareSort[tableId] = next;
      drawComparisonTable(container, tableId, rows, selected, showHeldBy);
    });
  });

  // Re-wire ticker clicks (they get torn down on re-render)
  container.querySelectorAll('tbody tr[data-ticker]').forEach(tr =>
    tr.addEventListener('click', () => openTickerDrawer(tr.dataset.ticker)));
}

// ============================================================================
// Conviction map — concentration (max %) vs. consensus (# funds holding)
// ============================================================================
function buildConvictionData() {
  const idx = buildTickerIndex();
  const out = [];
  for (const [ticker, list] of idx.entries()) {
    const cat = list[0].holding.category;
    if (STATE.filterCategory && cat !== STATE.filterCategory) continue;
    const maxHolder = list.reduce((a, b) => b.holding.pct > a.holding.pct ? b : a);
    const totalUsd = list.reduce((s, x) => s + x.holding.total, 0);
    const medianPct = median(list.map(x => x.holding.pct));
    out.push({
      ticker,
      issuer: list[0].holding.issuer,
      category: cat,
      numFunds: list.length,
      maxPct: maxHolder.holding.pct,
      medianPct,
      totalUsd,
      maxFund: maxHolder.fund.shortLabel,
      holders: list,
    });
  }
  return out;
}

function renderConviction(root) {
  // ----- Category filter chips -----
  const catFilter = document.createElement('div');
  catFilter.className = 'category-filter';
  const allChip = document.createElement('span');
  allChip.className = 'cat-chip' + (STATE.filterCategory === null ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { STATE.filterCategory = null; render(); };
  catFilter.appendChild(allChip);
  for (const c of STATE.data.categories) {
    const chip = document.createElement('span');
    chip.className = 'cat-chip' + (STATE.filterCategory === c ? ' active' : '');
    chip.innerHTML = `<span class="swatch" style="background:${catColor(c)}"></span>${c}`;
    chip.onclick = () => { STATE.filterCategory = (STATE.filterCategory === c) ? null : c; render(); };
    catFilter.appendChild(chip);
  }
  root.appendChild(catFilter);

  // ----- Layout: chart left, side panels right -----
  const wrap = document.createElement('div');
  wrap.className = 'conviction-wrap';
  root.appendChild(wrap);

  const data = buildConvictionData();

  // ----- Chart card -----
  const chartCard = document.createElement('div');
  chartCard.className = 'conviction-chart';
  chartCard.innerHTML = `
    <div class="card-header" style="margin-bottom:0">
      <h2>Conviction map</h2>
      <div class="right">Concentration (max % in any fund) vs. Consensus (# of funds holding)</div>
    </div>
    <div id="convictionSvgWrap" style="position:relative; margin-top: 8px"></div>
    <div class="legend" style="margin-top:8px">
      ${STATE.data.categories.map(c => `<div><span class="swatch" style="background:${catColor(c)}"></span>${c}</div>`).join('')}
      <div style="margin-left:auto; color: var(--text-faint)">Dot size = total $ across funds</div>
    </div>`;
  wrap.appendChild(chartCard);
  drawConvictionChart(chartCard.querySelector('#convictionSvgWrap'), data);

  // ----- Side panels -----
  const side = document.createElement('div');
  side.className = 'conviction-side';
  wrap.appendChild(side);

  // Lonely conviction: a name qualifies if EITHER
  //   (a) held by ≤2 funds at >5%, OR
  //   (b) top holder is at >10% AND >3x the median holder's allocation
  //       (catches names like CRWV: 3 holders but SA is 4-5x larger than the rest)
  const lonely = data
    .filter(d => {
      const ratio = d.medianPct > 0 ? d.maxPct / d.medianPct : Infinity;
      const a = d.numFunds <= 2 && d.maxPct > 0.05;
      const b = d.maxPct > 0.10 && ratio > 3;
      return a || b;
    })
    .sort((a, b) => b.maxPct - a.maxPct)
    .slice(0, 12);
  const lonelyCard = document.createElement('div');
  lonelyCard.className = 'card';
  lonelyCard.innerHTML = `
    <div class="card-header"><h2>Lonely conviction</h2>
      <div class="right">Few holders OR one fund far ahead of peers</div></div>
    <div style="font-size: 11px; color: var(--text-faint); margin-bottom: 8px">≤ 2 holders at &gt;5%, or top holder at &gt;10% AND &gt;3× the median.</div>`;
  if (!lonely.length) {
    lonelyCard.innerHTML += '<div class="empty">No matches with current filter.</div>';
  } else {
    const ul = document.createElement('ul');
    ul.className = 'conviction-list';
    for (const d of lonely) {
      const li = document.createElement('li');
      li.dataset.ticker = d.ticker;
      const ratio = d.medianPct > 0 ? (d.maxPct / d.medianPct).toFixed(1) + '×' : '—';
      const peerCount = d.numFunds === 1
        ? 'solo holder'
        : `${d.numFunds} holders · ${ratio} vs. median`;
      li.innerHTML = `
        <div><span class="ticker">${d.ticker}</span></div>
        <div>
          <div style="color: var(--text); font-weight: 500">${d.maxFund}</div>
          <div class="lc-meta"><span class="cat-chip" style="font-size: 9px; padding: 1px 5px"><span class="swatch" style="background:${catColor(d.category)}"></span>${d.category}</span> · ${peerCount}</div>
        </div>
        <div class="lc-pct">${fmtPct(d.maxPct)}</div>`;
      li.onclick = () => openTickerDrawer(d.ticker);
      ul.appendChild(li);
    }
    lonelyCard.appendChild(ul);
  }
  side.appendChild(lonelyCard);

  // Crowded mega-bets: ≥5 funds AT >5% median
  const crowded = data
    .filter(d => d.numFunds >= 5 && d.medianPct > 0.05)
    .sort((a, b) => b.medianPct * b.numFunds - a.medianPct * a.numFunds)
    .slice(0, 10);
  const crowdedCard = document.createElement('div');
  crowdedCard.className = 'card';
  crowdedCard.innerHTML = `
    <div class="card-header"><h2>Crowded mega-bets</h2>
      <div class="right">≥ 5 holders · median &gt;5%</div></div>
    <div style="font-size: 11px; color: var(--text-faint); margin-bottom: 8px">The consensus AI trades — high agreement and high conviction together.</div>`;
  if (!crowded.length) {
    crowdedCard.innerHTML += '<div class="empty">No matches with current filter.</div>';
  } else {
    const ul = document.createElement('ul');
    ul.className = 'conviction-list';
    for (const d of crowded) {
      const li = document.createElement('li');
      li.dataset.ticker = d.ticker;
      li.innerHTML = `
        <div><span class="ticker">${d.ticker}</span></div>
        <div>
          <div style="color: var(--text); font-weight: 500">${d.numFunds} funds</div>
          <div class="lc-meta"><span class="cat-chip" style="font-size: 9px; padding: 1px 5px"><span class="swatch" style="background:${catColor(d.category)}"></span>${d.category}</span></div>
        </div>
        <div class="lc-pct">${fmtPct(d.medianPct)}</div>`;
      li.onclick = () => openTickerDrawer(d.ticker);
      ul.appendChild(li);
    }
    crowdedCard.appendChild(ul);
  }
  side.appendChild(crowdedCard);
}

function drawConvictionChart(container, data) {
  // Chart dims
  const W = 920, H = 540;
  const M = { top: 30, right: 30, bottom: 50, left: 60 };
  const PW = W - M.left - M.right;
  const PH = H - M.top - M.bottom;

  // Scales
  const maxFunds = Math.max(8, ...data.map(d => d.numFunds));
  const maxPct = Math.max(0.25, ...data.map(d => d.maxPct));
  const niceMax = Math.ceil(maxPct * 20) / 20; // round up to nearest 5%
  const xOf = n => M.left + ((n - 0.5) / maxFunds) * PW;
  const yOf = p => M.top + PH - (p / niceMax) * PH;

  // Dot size by total $ — sqrt scale, jittered to avoid all-tiny dots when totals are small
  const maxUsd = Math.max(1, ...data.map(d => d.totalUsd));
  const rOf = u => 5 + Math.sqrt(u / maxUsd) * 22;

  // Quadrant cutoffs: 5% conviction line, ~half the funds for consensus
  const convictionLineY = yOf(0.05);
  const consensusLineX = xOf(Math.ceil(maxFunds / 2));

  // Build SVG
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // Grid + ticks
  const yTicks = [];
  for (let p = 0; p <= niceMax + 0.0001; p += 0.05) yTicks.push(Math.round(p * 100) / 100);
  for (const t of yTicks) {
    const y = yOf(t);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('class', 'grid-line');
    line.setAttribute('x1', M.left); line.setAttribute('x2', W - M.right);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    svg.appendChild(line);
    const lbl = document.createElementNS(svgNS, 'text');
    lbl.setAttribute('class', 'tick-label');
    lbl.setAttribute('x', M.left - 8); lbl.setAttribute('y', y + 3);
    lbl.setAttribute('text-anchor', 'end');
    lbl.textContent = (t * 100).toFixed(0) + '%';
    svg.appendChild(lbl);
  }
  for (let n = 1; n <= maxFunds; n++) {
    const x = xOf(n);
    const lbl = document.createElementNS(svgNS, 'text');
    lbl.setAttribute('class', 'tick-label');
    lbl.setAttribute('x', x); lbl.setAttribute('y', H - M.bottom + 16);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.textContent = n;
    svg.appendChild(lbl);
  }

  // Axis labels
  const xlbl = document.createElementNS(svgNS, 'text');
  xlbl.setAttribute('class', 'axis-label');
  xlbl.setAttribute('x', M.left + PW / 2); xlbl.setAttribute('y', H - 10);
  xlbl.setAttribute('text-anchor', 'middle');
  xlbl.textContent = '# of funds holding (consensus →)';
  svg.appendChild(xlbl);

  const ylbl = document.createElementNS(svgNS, 'text');
  ylbl.setAttribute('class', 'axis-label');
  ylbl.setAttribute('x', -(M.top + PH / 2)); ylbl.setAttribute('y', 16);
  ylbl.setAttribute('text-anchor', 'middle');
  ylbl.setAttribute('transform', 'rotate(-90)');
  ylbl.textContent = 'Max % allocation (conviction ↑)';
  svg.appendChild(ylbl);

  // Quadrant dividers
  const hLine = document.createElementNS(svgNS, 'line');
  hLine.setAttribute('class', 'quadrant-line');
  hLine.setAttribute('x1', M.left); hLine.setAttribute('x2', W - M.right);
  hLine.setAttribute('y1', convictionLineY); hLine.setAttribute('y2', convictionLineY);
  svg.appendChild(hLine);
  const vLine = document.createElementNS(svgNS, 'line');
  vLine.setAttribute('class', 'quadrant-line');
  vLine.setAttribute('x1', consensusLineX); vLine.setAttribute('x2', consensusLineX);
  vLine.setAttribute('y1', M.top); vLine.setAttribute('y2', H - M.bottom);
  svg.appendChild(vLine);

  // Quadrant labels
  const quadrantLabels = [
    { x: M.left + 12, y: M.top + 14, text: 'LONELY CONVICTION', anchor: 'start' },
    { x: W - M.right - 12, y: M.top + 14, text: 'CROWDED MEGA-BETS', anchor: 'end' },
    { x: M.left + 12, y: H - M.bottom - 10, text: 'TAIL POSITIONS', anchor: 'start' },
    { x: W - M.right - 12, y: H - M.bottom - 10, text: 'CONSENSUS SMALL BETS', anchor: 'end' },
  ];
  for (const q of quadrantLabels) {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('class', 'quadrant-label');
    t.setAttribute('x', q.x); t.setAttribute('y', q.y);
    t.setAttribute('text-anchor', q.anchor);
    t.textContent = q.text;
    svg.appendChild(t);
  }

  // Sort dots by total $ descending so big dots draw under little ones,
  // keeping small/lonely conviction dots visible
  const sorted = [...data].sort((a, b) => b.totalUsd - a.totalUsd);

  // Jitter X so dots at the same integer don't all overlap
  const xJitter = (ticker, n) => {
    let h = 0; for (let i = 0; i < ticker.length; i++) h = (h * 31 + ticker.charCodeAt(i)) | 0;
    return xOf(n) + ((h % 100) / 100 - 0.5) * 28;
  };

  // Tooltip
  const tip = document.createElement('div');
  tip.className = 'conviction-tooltip';
  container.appendChild(tip);

  // Dots
  for (const d of sorted) {
    const cx = xJitter(d.ticker, d.numFunds);
    const cy = yOf(d.maxPct);
    const r = rOf(d.totalUsd);
    const color = catColor(d.category);

    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('class', 'dot');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', color); c.setAttribute('fill-opacity', '0.7');
    c.setAttribute('stroke', color); c.setAttribute('stroke-opacity', '0.9'); c.setAttribute('stroke-width', '1');

    // Hover
    c.addEventListener('mouseenter', (ev) => {
      tip.style.display = 'block';
      tip.innerHTML = `
        <div class="t">${d.ticker}</div>
        <div style="color: var(--text-dim); font-size: 10px; margin-bottom: 4px">${escapeHtml(d.issuer)}</div>
        <div class="row"><span>Category</span><span class="v">${d.category}</span></div>
        <div class="row"><span># funds holding</span><span class="v">${d.numFunds}</span></div>
        <div class="row"><span>Max allocation</span><span class="v">${fmtPct(d.maxPct)} (${d.maxFund})</span></div>
        <div class="row"><span>Median allocation</span><span class="v">${fmtPct(d.medianPct)}</span></div>
        <div class="row"><span>Total across funds</span><span class="v">${fmtDollarsM(d.totalUsd, 0)}</span></div>`;
    });
    c.addEventListener('mousemove', (ev) => {
      const rect = container.getBoundingClientRect();
      const x = ev.clientX - rect.left + 14;
      const y = ev.clientY - rect.top + 14;
      tip.style.left = Math.min(x, rect.width - 230) + 'px';
      tip.style.top = Math.min(y, rect.height - 160) + 'px';
    });
    c.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    c.addEventListener('click', () => openTickerDrawer(d.ticker));
    svg.appendChild(c);

    // Label only big dots so the chart stays readable
    if (r >= 10 || d.maxPct >= 0.10) {
      const lbl = document.createElementNS(svgNS, 'text');
      lbl.setAttribute('class', 'dot-label');
      lbl.setAttribute('x', cx); lbl.setAttribute('y', cy + 3);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.textContent = d.ticker;
      svg.appendChild(lbl);
    }
  }

  container.appendChild(svg);
}

// ============================================================================
// Ticker drawer
// ============================================================================
function openTickerDrawer(ticker) {
  const idx = buildTickerIndex();
  const holders = idx.get(ticker);
  if (!holders) return;
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  document.getElementById('drawerTitle').textContent = ticker;
  document.getElementById('drawerSub').textContent = holders[0].holding.issuer + ' · ' + holders[0].holding.category;

  const cat = holders[0].holding.category;
  const totalAcross = holders.reduce((s, h) => s + h.holding.total, 0);
  const numFunds = holders.length;
  const med = median(holders.map(h => h.holding.pct));

  let html = `
    <div class="stat-row">
      <div class="stat"><div class="label"># Funds holding</div><div class="value">${numFunds}</div></div>
      <div class="stat"><div class="label">Median % of 13F</div><div class="value small">${fmtPct(med)}</div></div>
      <div class="stat"><div class="label">Total across funds</div><div class="value small">${fmtDollarsM(totalAcross, 0)}</div></div>
    </div>
    <div style="margin: 8px 0 16px"><span class="cat-chip active"><span class="swatch" style="background:${catColor(cat)}"></span>${cat}</span></div>
    <h3>Holders</h3>
    <table>
      <thead><tr>
        <th>Fund</th>
        <th class="num">Equity</th>
        <th class="num">Calls</th>
        <th class="num">Puts</th>
        <th class="num">% of 13F</th>
      </tr></thead>
      <tbody>
      ${holders.sort((a, b) => b.holding.pct - a.holding.pct).map(h => `
        <tr data-fund="${escapeAttr(h.fund.shortLabel)}">
          <td style="cursor:pointer">${h.fund.shortLabel}${h.fund.isReference ? '<span class="badge sa">REF</span>' : ''}</td>
          <td class="num">${fmtDollarsM(h.holding.equity)}</td>
          <td class="num" style="${h.holding.calls>0?'color:var(--calls)':'color:var(--text-faint)'}">${fmtDollarsM(h.holding.calls)}</td>
          <td class="num" style="${h.holding.puts>0?'color:var(--puts)':'color:var(--text-faint)'}">${fmtDollarsM(h.holding.puts)}</td>
          <td class="num"><strong>${fmtPct(h.holding.pct)}</strong></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  document.getElementById('drawerBody').innerHTML = html;

  document.getElementById('drawerBody').querySelectorAll('tr[data-fund]').forEach(tr =>
    tr.addEventListener('click', () => { closeDrawer(); navigateToFund(tr.dataset.fund); }));

  drawer.classList.add('show');
  drawer.setAttribute('aria-hidden', 'false');
  overlay.classList.add('show');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerOverlay').classList.remove('show');
}

// ============================================================================
// EDGAR update
// ============================================================================
async function runEdgarUpdate() {
  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Fetching from EDGAR…';
  try {
    const ciks = STATE.data.funds.filter(f => f.cik).map(f => f.cik);
    const r = await fetch('/api/edgar?ciks=' + ciks.join(','));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const result = await r.json();
    STATE.edgarResults = result;
    location.hash = '#/dashboard';
    render();
  } catch (e) {
    STATE.edgarResults = { error: e.message };
    render();
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function renderEdgarStatus() {
  const card = document.createElement('div');
  card.className = 'edgar-status';
  const r = STATE.edgarResults;
  if (r.error) {
    card.innerHTML = `<div class="err"><strong>EDGAR fetch failed:</strong> ${escapeHtml(r.error)}</div>`;
    return card;
  }
  let html = `<div style="margin-bottom: 8px"><strong>EDGAR results</strong> <span style="color:var(--text-faint)">${r.fetchedAt || ''}</span> <button class="btn" style="float:right; padding: 2px 8px; font-size: 10px" id="dismissEdgar">Dismiss</button></div>`;
  for (const f of (r.funds || [])) {
    const newBadge = f.isNew ? '<span class="badge new">NEW</span>' : '';
    const status = f.error
      ? `<span class="err">${escapeHtml(f.error)}</span>`
      : `<span class="ok">${f.numIssuers || 0} issuers · ${f.periodOfReport || '—'}</span>`;
    html += `<div class="row"><div>${f.fundName || f.cik} ${newBadge}</div><div>${status}</div></div>`;
  }
  card.innerHTML = html;
  setTimeout(() => {
    const btn = card.querySelector('#dismissEdgar');
    if (btn) btn.onclick = () => { STATE.edgarResults = null; render(); };
  }, 0);
  return card;
}

// ============================================================================
// Search
// ============================================================================
let SEARCH_TICKERS = [], SEARCH_FUNDS = [];
function renderSearchIndex() {
  const idx = buildTickerIndex();
  SEARCH_TICKERS = [];
  for (const [ticker, list] of idx.entries()) {
    SEARCH_TICKERS.push({ ticker, issuer: list[0].holding.issuer });
  }
  SEARCH_FUNDS = STATE.data.funds.map(f => ({ name: f.shortLabel, full: f.name }));
}

function setupEvents() {
  const inp = document.getElementById('searchInput');
  const out = document.getElementById('searchResults');
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (!q) { out.classList.remove('show'); return; }
    const tickers = SEARCH_TICKERS.filter(t =>
      t.ticker.toLowerCase().startsWith(q) || t.issuer.toLowerCase().includes(q)).slice(0, 8);
    const funds = SEARCH_FUNDS.filter(f =>
      f.name.toLowerCase().includes(q) || f.full.toLowerCase().includes(q)).slice(0, 6);
    let html = '';
    if (tickers.length) {
      html += '<div class="group">Tickers</div>';
      for (const t of tickers) html += `<div class="item" data-action="ticker" data-arg="${escapeAttr(t.ticker)}"><span class="t">${t.ticker}</span><span class="name">${escapeHtml(t.issuer)}</span></div>`;
    }
    if (funds.length) {
      html += '<div class="group">Funds</div>';
      for (const f of funds) html += `<div class="item" data-action="fund" data-arg="${escapeAttr(f.name)}"><span class="t">${escapeHtml(f.name)}</span><span class="name">${escapeHtml(f.full)}</span></div>`;
    }
    if (!html) html = '<div class="item" style="color:var(--text-faint)">No matches</div>';
    out.innerHTML = html;
    out.classList.add('show');
    out.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', () => {
      const a = el.dataset.action, arg = el.dataset.arg;
      out.classList.remove('show');
      inp.value = '';
      if (a === 'ticker') openTickerDrawer(arg);
      else if (a === 'fund') navigateToFund(arg);
    }));
  });
  inp.addEventListener('blur', () => setTimeout(() => out.classList.remove('show'), 150));

  // Nav clicks
  document.querySelectorAll('nav.tabs a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    location.hash = a.dataset.route;
  }));

  document.getElementById('drawerClose').onclick = closeDrawer;
  document.getElementById('drawerOverlay').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  document.getElementById('updateBtn').onclick = runEdgarUpdate;
}

function navigateToFund(shortLabel) {
  location.hash = '#/fund/' + encodeURIComponent(shortLabel);
}

// ============================================================================
// Caveats
// ============================================================================
function renderCaveats() {
  const ul = document.getElementById('caveats');
  for (const c of (STATE.data.caveats || [])) {
    const li = document.createElement('li');
    li.textContent = c;
    ul.appendChild(li);
  }
}

// ============================================================================
// Utils
// ============================================================================
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

</script>
</body>
</html>
