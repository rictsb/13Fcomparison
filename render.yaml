# Render Blueprint — one-click deploy.
#
# To use:
#   1. Push this repo to GitHub.
#   2. In Render: New → Blueprint → connect this repo → Apply.
#   3. After the first deploy, open the service's Environment tab and set
#      SEC_USER_AGENT to your own "Name email@domain.com" (SEC requires it).
#
# This is the existing paid Starter service. The earnings page shares its
# compute and the existing Site's D1 storage; it does not add a service or disk.

services:
  - type: web
    name: 13f-tracker
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SEC_USER_AGENT
        sync: false  # set this manually in the Render dashboard (e.g. "Richard you@email.com")
      - key: FINNHUB_API_KEY
        sync: false  # set this manually — free key from finnhub.io. Powers the
                     # "Δ since report" column's live-price refresh.
